  ];
  function slashMatch(value) {
    // '/' at line start or after whitespace; a second '/' or an inline URL
    // slash does NOT trigger (mirrors dsh-client-ui-input-trigger).
    var m = /(?:^|\s)\/([^\s\/]*)$/.exec(value);
    return m ? { query: m[1], start: m.index + m[0].indexOf("/") } : null;
  }
  // Clicking a candidate executes the command IMMEDIATELY (same line as
  // typing it by hand: exactly "/name", no trailing space). Any text typed
  // before the slash stays in the input for the next send.
  function runSlash(name) {
    var m = slashMatch(inputEl.value);
    if (m) {
      inputEl.value = inputEl.value.slice(0, m.start);
      autoGrow();
    }
    hideMenu();
    var line = "/" + name;
    state.items.push({ kind: "user", text: line, pending: true, turn: state.lastTurn });
    scheduleRender();
    post({ type: "send", text: line, attachments: [], mode: "queue" });
    history.push(line);
    if (history.length > 200) history.shift();
  }
  function slashRows(q) {
    var v = q.trim().toLowerCase();
    var list = state.commands && state.commands.length ? state.commands : SLASH_COMMANDS;
    var rows = [];
    list.forEach(function (c) {
      var name = String(c.name || "").toLowerCase();
      if (v && name.indexOf(v) < 0) return;
      rows.push({
        kind: "slash",
        name: "/" + c.name,
        desc: (c.description || "") + (c.input && c.input.hint ? " — 带参数请手输 /" + c.name + " " + c.input.hint : ""),
        cmd: c.name
      });
    });
    return rows.slice(0, 30);
  }

  function updateHeader() {
    var s = state.sessions.find(function (x) { return x.sessionId === state.activeSessionId; });
    if (state.connected) {
      pillEl.className = "pill " + (state.running ? "busy" : "on");
      pillEl.textContent = "";
      pillEl.title = (state.running ? "运行中" : "已连接") + " · harness v" + (state.version || "?");
    } else if (state.phase === "offline") {
      pillEl.className = "pill off";
      pillEl.textContent = "";
      pillEl.title = "DSH Bridge: 未连接 harness";
    } else {
      pillEl.className = "pill loading";
      pillEl.textContent = "";
      pillEl.title = "DSH Bridge: 正在加载…";
    }
    // Session button label mirrors the active row; the full list (grouped by
    // workspace) lives in the dropdown so the header stays one line tall.
    var selLabel = s ? (state.titles[s.sessionId] || s.title || ("会话 " + shortId(s.sessionId))) : "（无会话）";
    selBtnEl.textContent = selLabel;
    selBtnEl.title = s && s.cwd ? (selLabel + "\n" + s.cwd) : "切换会话";
    if (!selMenuEl.hidden) renderSessionMenu();
    cancelBtn.hidden = !state.running;
    // Composer takeover: while an interaction is pending the main input row is
    // hidden entirely (regardless of connectivity changes).
    if (inputRowEl) inputRowEl.hidden = !!state.interact;
    sendBtn.disabled = !state.connected;
    updateWorkspaceLine();
    updateStatusLine();
  }

  /* Workspace strip above the header: mirrors state.workspace (the VS Code folder
     or the folder picked with the 工作区 button); full path lives in the tooltip. */
  function updateWorkspaceLine() {
    var ws = state.workspace;
    wsLineEl.hidden = false;
    wsPathEl.textContent = ws || "（未打开文件夹）";
    wsPathEl.style.fontStyle = ws ? "" : "italic";
    wsLineEl.title = ws
      ? ws + "\n新会话与 web GUI 的默认工作区（可用右侧「工作区」按钮更改）"
      : "未打开文件夹，也未手选工作区";
  }

  /* Ask mode chrome switch (state.mode === "ask"). */
  function applyAskMode() {
    document.body.classList.toggle("ask-mode", state.mode === "ask");
  }

  /* ---------- session picker (grouped by workspace) ----------
     Rows are grouped by session cwd: the CURRENT editor workspace lists first,
     everything else hides behind "其他工作区" (click to expand), so switching
     between the open folder's sessions doesn't wade through unrelated history. */
  var othersOpen = false;
  function normPath(p) {
    if (!p) return "";
    return String(p).replace(/\//g, "\\").replace(/\\+$/, "").toLowerCase();
  }
  function renderSessionMenu() {
    selMenuEl.innerHTML = "";
    var sessions = state.sessions || [];
    var cur = normPath(state.workspace);
    var title = document.createElement("div");
    title.className = "cp-title";
    title.textContent = cur ? "当前工作区" : "会话";
    selMenuEl.appendChild(title);
    var mine = [], others = [];
    if (cur) {
      sessions.forEach(function (sess) {
        if (normPath(sess.cwd) === cur) mine.push(sess); else others.push(sess);
      });
    } else {
      mine = sessions; // no folder open: flat list, same as before
    }
    if (!sessions.length) {
      var empty = document.createElement("div");
      empty.className = "cp-row sm-empty";
      empty.textContent = "暂无会话";
      selMenuEl.appendChild(empty);
      return;
    }
    if (!mine.length) {
      var none = document.createElement("div");
      none.className = "cp-row sm-empty";
      none.textContent = "当前工作区暂无会话";
      selMenuEl.appendChild(none);
    }
    mine.forEach(function (sess) { appendSessionRow(sess, !!cur); });
    if (!others.length) return;
    var toggle = document.createElement("div");
    toggle.className = "cp-row sm-toggle";
    toggle.textContent = (othersOpen ? "▾ " : "▸ ") + "其他工作区（" + others.length + "）";
    toggle.addEventListener("click", function (ev) {
      ev.stopPropagation();
      othersOpen = !othersOpen;
      renderSessionMenu();
    });
    selMenuEl.appendChild(toggle);
    if (!othersOpen) return;
    var byCwd = new Map();
    others.forEach(function (sess) {
      var key = normPath(sess.cwd);
      if (!byCwd.has(key)) byCwd.set(key, { path: sess.cwd || "", items: [] });
      byCwd.get(key).items.push(sess);
    });
    byCwd.forEach(function (group) {
      var head = document.createElement("div");
      head.className = "cp-group";
      head.textContent = group.path || "（未指定工作区）";
      head.title = group.path;
      selMenuEl.appendChild(head);
      group.items.forEach(function (sess) { appendSessionRow(sess); });
    });
  }
  function appendSessionRow(sess, bold) {
    var row = document.createElement("div");
    row.className = "cp-row" + (sess.sessionId === state.activeSessionId ? " sel" : "") + (bold ? " sm-mine" : "");
    var label = document.createElement("span");
    label.className = "cp-label";
    var title = state.titles[sess.sessionId] || sess.title || "";
    var text = title ? title : ("会话 " + shortId(sess.sessionId));
    var time = relTime(sess.updatedAt);
    label.textContent = time ? (text + " · " + time) : text;
    row.appendChild(label);
    if (sess.running) {
      var dot = document.createElement("span");
      dot.className = "cp-sub";
      dot.textContent = "●";
      row.appendChild(dot);
    }
    if (sess.cwd) row.title = sess.cwd;
    row.addEventListener("click", function () {
      selMenuEl.hidden = true;
      if (sess.sessionId !== state.activeSessionId) post({ type: "selectSession", sessionId: sess.sessionId });
    });
    selMenuEl.appendChild(row);
  }

  /* ---------- ＋ new-session mode picker (agent presets) ----------
     Clicking ＋ opens a dropdown of the four modes (标准 / PTC / 极简 / 创造,
     plus any user-authored presets); hovering an option shows the official
     explanation; picking one creates the session with that agent preset. */
  var modeMenuEl = $("mode-menu"), modeMenuOpen = false, modeTipEl = null;
  function renderModeMenu() {
    modeMenuEl.innerHTML = "";
    var modes = state.modes || [];
    if (!modes.length) {
      var empty = document.createElement("div");
      empty.className = "mode-empty";
      empty.textContent = "正在加载模式…";
      modeMenuEl.appendChild(empty);
      post({ type: "getAgentPresets" });
      return;
    }
    modes.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "mode-item";
      var name = document.createElement("span");
      name.className = "m-name";
      name.textContent = m.name || m.id;
      row.appendChild(name);
      if (m.isDefault) {
        var badge = document.createElement("span");
        badge.className = "m-default";
        badge.textContent = "默认";
        row.appendChild(badge);
      }
      row.addEventListener("mouseenter", function () { showModeTip(m.description || "", row); });
      row.addEventListener("mouseleave", hideModeTip);
      row.addEventListener("click", function () {
        hideModeTip();
        closeModeMenu();
        post({ type: "newSession", agentPreset: m.id });
      });
      modeMenuEl.appendChild(row);
    });
  }
  function showModeTip(text, rowEl) {
    if (!text) { hideModeTip(); return; }
    if (!modeTipEl) {
      modeTipEl = document.createElement("div");
      modeTipEl.id = "mode-tip";
      document.body.appendChild(modeTipEl);
    }
    modeTipEl.textContent = text;
    modeTipEl.hidden = false;
    // Anchor beside the hovered row, clamped to the viewport.
    var r = rowEl.getBoundingClientRect();
    var w = modeTipEl.offsetWidth || 280;
    var left = r.right + 8;
    if (left + w > window.innerWidth - 4) left = Math.max(4, r.left - w - 8);
    var top = Math.max(4, r.top);
    // On narrow panels the clamp can pull the tip back over the menu itself;
    // when it overlaps the hovered row horizontally, drop it below the row so
    // the mode under the cursor stays readable.
    if (left < r.right && left + w > r.left) {
      var h = modeTipEl.offsetHeight || 60;
      top = r.bottom + 4 + h <= window.innerHeight - 4 ? r.bottom + 4 : Math.max(4, r.top - h - 4);
    }
    modeTipEl.style.left = left + "px";
    modeTipEl.style.top = top + "px";
  }
  function hideModeTip() {
    if (modeTipEl) modeTipEl.hidden = true;
  }
  function openModeMenu() {
    renderModeMenu();
    modeMenuEl.hidden = false;
    modeMenuOpen = true;
  }
  function closeModeMenu() {
    modeMenuEl.hidden = true;
    modeMenuOpen = false;
    hideModeTip();
  }
  document.addEventListener("click", function (ev) {
    if (!modeMenuOpen) return;
    var t = ev.target;
    if (t && t.closest && t.closest("#new-session-wrap")) return;
    closeModeMenu();
  });
  document.addEventListener("keydown", function (ev) {
    if (modeMenuOpen && ev.key === "Escape") closeModeMenu();
  });

  /* ---------- composer buttons: permission (left) + model/effort (right) ----------
     The old header selects moved into the input row as two small buttons with
     slide-up popups: perm-btn shows the current permission preset, model-btn
     shows the current model and opens a two-section popup (models + reasoning
     efforts). The top bar now holds only session select + settings + new/delete. */
  function renderPermButton() {
    var presets = state.presets || [];
    if (!presets.length) { permBtnEl.hidden = true; permBtnEl.textContent = ""; return; }
    var cur = state.permCurrent;
    var label = "";
    for (var i = 0; i < presets.length; i++) {
      if (presets[i].value === cur) { label = presets[i].label || cur; break; }
    }
    if (!label) label = cur || "权限";
    permBtnEl.textContent = label;
    permBtnEl.hidden = false;
    if (!permMenuEl.hidden) renderPermMenu();
  }

  function renderPermMenu() {
    permMenuEl.innerHTML = "";
    var presets = state.presets || [];
    if (!presets.length) { permMenuEl.hidden = true; return; }
    var cur = state.permCurrent;
    var title = document.createElement("div");
    title.className = "cp-title";
    title.textContent = "权限预设";
    permMenuEl.appendChild(title);
    presets.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "cp-row" + (cur === p.value ? " sel" : "");
      row.textContent = p.label || p.value;
      row.addEventListener("click", function () {
        if (p.value !== cur) post({ type: "selectPermission", permission: p.value });
        permMenuEl.hidden = true;
      });
      permMenuEl.appendChild(row);
    });
  }

  /* ---------- plan mode (right of the permission chip) ----------
     DSH ships plan mode natively (`/plan` + `plan` projection +
     exit_plan_mode review). The button reflects the logged {active, pending}
     view; the menu picks between the official SOFT variant (guidance only)
     and a HARD variant that also locks the session to read-only and restores
     the previous preset when plan mode ends. */
  function renderPlanButton() {
    var pm = state.planMode;
    if (!pm) {
      planBtnEl.hidden = true; planBtnEl.textContent = "";
      planBtnEl.classList.remove("on", "pend");
      return;
    }
    var label = "计划";
    if (pm.active) label = pm.variant === "hard" ? "计划·只读" : "计划·引导";
    planBtnEl.textContent = label;
    planBtnEl.classList.toggle("on", !!pm.active);
    planBtnEl.classList.toggle("pend", !!pm.pending);
    planBtnEl.title = "计划模式：先探索并提交计划，评审批准后才执行（/plan）" +
      (pm.pending ? "。切换将在下一步生效" : "");
    planBtnEl.hidden = false;
    if (!planMenuEl.hidden) renderPlanMenu();
  }

  function renderPlanMenu() {
    planMenuEl.innerHTML = "";
    var pm = state.planMode || { active: false, pending: false, variant: null };
    var title = document.createElement("div");
    title.className = "cp-title";
    title.textContent = "计划模式";
    planMenuEl.appendChild(title);
    function addRow(label, desc, selected, action) {
      var row = document.createElement("div");
      row.className = "cp-row" + (selected ? " sel" : "");
      var main = document.createElement("span");
      main.textContent = label;
      row.appendChild(main);
      if (desc) {
        var sub = document.createElement("span");
        sub.className = "cp-sub";
        sub.textContent = desc;
        row.appendChild(sub);
      }
      row.addEventListener("click", function () {
        planMenuEl.hidden = true;
        post({ type: "planMode", action: action });
      });
      planMenuEl.appendChild(row);
    }
    addRow("计划模式（软引导）", "先规划 · 无硬限制", pm.active && pm.variant !== "hard", "soft");
    addRow("计划模式 + 强制只读", "权限锁为仅可查看", pm.active && pm.variant === "hard", "hard");
    if (pm.active) addRow(pm.pending ? "退出计划模式（切换中…）" : "退出计划模式", "恢复默认执行", false, "off");
  }

  /* ---------- account balance chip (right of the plan button) ---------- */
  /** Amount display: round DOWN to 2 decimals + thousands separators — the
   *  official account UI's BigDecimal.roundDown formatting, mirrored. */
  function fmtMoney(s) {
    var n = Number(s);
    if (!isFinite(n)) return String(s == null ? "" : s);
    var cents = Math.floor(Math.abs(n) * 100 + 1e-6);
    var whole = String(Math.floor(cents / 100));
    var frac = String(cents % 100);
    if (frac.length < 2) frac = "0" + frac;
    return (n < 0 ? "-" : "") + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + frac;
  }
  var CURRENCY_SIGN = { CNY: "¥", USD: "$" };
  function renderBalance() {
    var b = state.balance;
    var wallets = b && Array.isArray(b.wallets) ? b.wallets : [];
    // Bonus wallets only show while a positive amount exists; zero/absent
    // bonuses stay hidden entirely (no "赠" tag, no title line).
    var bonuses = b && Array.isArray(b.bonusWallets)
      ? b.bonusWallets.filter(function (w) { var n = Number(w && w.balance); return isFinite(n) && n > 0; })
      : [];
    if (!wallets.length && !bonuses.length) { balanceChipEl.hidden = true; balanceChipEl.textContent = ""; return; }
    function amountText(w) { return (CURRENCY_SIGN[w.currency] || w.currency + " ") + fmtMoney(w.balance); }
    var mainText = wallets.map(amountText).join(" ");
    var bonusText = bonuses.map(amountText).join(" ");
    // Visible chip = wallet balances + a compact bonus tag; the title carries
    // the full breakdown (mirrors the official account panel's separate
    // 余额 / 赠送余额 rows). Wallets are generic: every currency is rendered
    // in wire order, not just the first one.
    balanceChipEl.textContent = mainText + (bonusText ? (mainText ? " " : "") + "赠 " + bonusText : "");
    var titleLines = [];
    if (mainText) titleLines.push("余额：" + mainText);
    if (bonusText) titleLines.push("赠送余额：" + bonusText);
    balanceChipEl.title = titleLines.join("\n");
    balanceChipEl.hidden = false;
  }

  function renderModelButton() {
    var cur = state.models && state.models.current;
    var groups = (state.models && state.models.groups) || [];
    if (!groups.length || !cur) { modelBtnEl.hidden = true; modelBtnEl.textContent = ""; return; }
    // Prefer the catalog display name over the raw model id.
    var label = cur.model || "模型";
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      if (g.id === cur.provider) {
        for (var mi = 0; mi < g.models.length; mi++) {
          if (g.models[mi].id === cur.model) { label = g.models[mi].name || label; break; }
        }
        break;
      }
    }
    modelBtnEl.textContent = label;
    modelBtnEl.title = (cur.provider || "") + " / " + (cur.model || "") + (cur.reasoningEffort ? " / " + cur.reasoningEffort : "");
    modelBtnEl.hidden = false;
    if (!modelMenuEl.hidden) renderModelMenu();
  }

  function renderModelMenu() {
    modelMenuEl.innerHTML = "";
    var cur = state.models && state.models.current;
    var groups = (state.models && state.models.groups) || [];
    if (!groups.length) { modelMenuEl.hidden = true; return; }
    var t1 = document.createElement("div");
    t1.className = "cp-title";
    t1.textContent = "模型";
    modelMenuEl.appendChild(t1);
    groups.forEach(function (g, gi) {
      if (groups.length > 1) {
        var head = document.createElement("div");
        head.className = "cp-group";
        if (gi === 0) head.style.borderTop = "none";
        head.textContent = g.name || g.id;
        modelMenuEl.appendChild(head);
      }
      g.models.forEach(function (m) {
        var sel = !!(cur && cur.provider === g.id && cur.model === m.id);
        var row = document.createElement("div");
        row.className = "cp-row" + (sel ? " sel" : "");
        row.textContent = m.name;
        if (sel) {
          var mark = document.createElement("span");
          mark.className = "cp-sub";
          mark.textContent = "✓";
          row.appendChild(mark);
        }
        row.addEventListener("click", function () {
          if (!sel) post({ type: "selectModel", provider: g.id, model: m.id });
          modelMenuEl.hidden = true;
        });
        modelMenuEl.appendChild(row);
      });
    });
  }

  /* reasoning-effort button: its own popup, right of the model button */
  function renderEffortButton() {
    var cur = state.models && state.models.current;
    if (!cur) { effortBtnEl.hidden = true; effortBtnEl.textContent = ""; return; }
    var label = cur.reasoningEffort || "推理";
    var efforts = currentEfforts();
    if (efforts && cur.reasoningEffort) {
      for (var i = 0; i < efforts.length; i++) {
        if (efforts[i].id === cur.reasoningEffort) { label = efforts[i].name || label; break; }
      }
    }
    effortBtnEl.textContent = label;
    effortBtnEl.hidden = false;
    if (!effortMenuEl.hidden) renderEffortMenu();
  }

  // Reasoning efforts come from the HARNESS (official per-model set), never a
  // hardcoded list: session.models reports each model's real reasoning.efforts
  // (off/low/high/max...). Resolve the current model's efforts by provider+model.
  function currentEfforts() {
    var cur = state.models && state.models.current;
    if (!cur) return null;
    var groups = (state.models && state.models.groups) || [];
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      if (g.id !== cur.provider) continue;
      for (var mi = 0; mi < g.models.length; mi++) {
        var m = g.models[mi];
        if (m.id !== cur.model) continue;
        if (m.reasoning && Array.isArray(m.reasoning.efforts) && m.reasoning.efforts.length > 0) {
          return m.reasoning.efforts;
        }
      }
    }
    return null;
  }

  function renderEffortMenu() {
    effortMenuEl.innerHTML = "";
    var cur = state.models && state.models.current;
    if (!cur) { effortMenuEl.hidden = true; return; }
    var t = document.createElement("div");
    t.className = "cp-title";
    t.textContent = "推理等级";
    effortMenuEl.appendChild(t);
    var curEffort = cur.reasoningEffort;
    // Official efforts for the current model; fall back to the current value
    // alone (still allows re-selecting it) when the harness reports none.
    var efforts = currentEfforts();
    var opts = efforts
      ? efforts.map(function (e) { return { id: e.id, label: e.name || e.id }; })
      : (curEffort ? [{ id: curEffort, label: curEffort }] : []);
    var hasCur = false;
    for (var oi = 0; oi < opts.length; oi++) { if (opts[oi].id === curEffort) { hasCur = true; break; } }
    if (curEffort && !hasCur) opts = opts.concat([{ id: curEffort, label: curEffort }]);
    opts.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "cp-row" + (curEffort === e.id ? " sel" : "");
      row.textContent = e.label;
      if (curEffort === e.id) {
        var mark = document.createElement("span");
        mark.className = "cp-sub";
        mark.textContent = "✓";
        row.appendChild(mark);
      }
      row.addEventListener("click", function () {
        if (curEffort !== e.id) {
          post({ type: "selectModel", provider: cur.provider, model: cur.model, reasoningEffort: e.id });
        }
        effortMenuEl.hidden = true;
      });
      effortMenuEl.appendChild(row);
    });
  }

  /* ---------- interaction card (approval / question from the agent) ---------- */
  var interactState = null; // {kind, rpcId, sessionId, approvalId?, selections: {qid:Set}, custom: string}
  var inputRowEl = $("input-row");
  // Composer takeover: while an interaction is pending the MAIN input row is
  // HIDDEN entirely — a stray user can't send a message instead of answering
  // (mirrors the web composer replacing the input seat; hiding beats disabling
  // because there is nothing left to click or type).
  function lockMainInput() {
    if (inputRowEl) inputRowEl.hidden = true;
    if (attachEl) attachEl.hidden = true;
  }
  function unlockMainInput() {
    if (inputRowEl) inputRowEl.hidden = false;
    renderAttachments(); // restores attach-row visibility per current attachments
    sendBtn.disabled = !state.connected;
    inputEl.disabled = false;
    inputEl.placeholder = "发消息…（Enter 发送，运行中自动排队；Shift+Enter 换行；Ctrl+V 粘图片）";
  }
  // Split the conventional recommendation suffix WITHOUT changing the answer
  // value: a label ending in (推荐)/(recommended)（推荐）（recommended） renders
  // with a "推荐" badge and the suffix stripped; the selected value keeps the
  // original label (mirrors the web question composer).
  function parseRecommendedLabel(label) {
    var m = /\s*(?:\((?:recommended|推荐)\)|（(?:recommended|推荐)）)\s*$/i.exec(label);
    return m
      ? { label: label.slice(0, m.index), recommended: true }
      : { label: label, recommended: false };
  }
  // Update submit/skip enablement: enabled once at least one answer exists
  // (any selection, custom text, or an explicit skip), disabled otherwise
  // (mirrors web composer).
  function updateInteractionButtons() {
    var st = interactState;
    if (!st) return;
    var submitBtn = $("in-submit");
    if (!submitBtn) return;
    if (st.kind === "question") {
      var qsNow = (state.interact && state.interact.questions) || [];
      var pagesNow = Math.max(1, Math.ceil(qsNow.length / QUESTION_PAGE_SIZE));
      var onLast = interactState.page >= pagesNow - 1;
      // "提交" only exists on the LAST question; earlier pages have just the
      // pager arrows (no next/submit button at all).
      submitBtn.hidden = !onLast;
      // Always require an answer to submit (a single-select auto-reaches the
      // last page with an answer; a multi-select/custom needs one here).
      var lastAnswered = false;
      var lastSel = interactState.selections[String(pagesNow - 1)];
      if (lastSel && lastSel.size > 0) lastAnswered = true;
      if (!lastAnswered) {
        var lastCustom = interactState.custom && interactState.custom[String(pagesNow - 1)];
        if (lastCustom && lastCustom.trim()) lastAnswered = true;
      }
      submitBtn.textContent = "提交";
      submitBtn.disabled = !lastAnswered;
    } else {
      submitBtn.textContent = "允许一次"; // not used for approval
    }
  }
  function renderInteraction(msg) {
    state.interact = msg;
    var inner = "";
    if (msg.kind === "approval") {
      inner = '<div class="in-card">' +
        '<div class="in-head"><span class="in-tag approval">审批</span> ' +
        esc(msg.toolName || "工具") + '</div>' +
        '<div class="in-ctx">' + (msg.reason ? esc(msg.reason) : "agent 请求执行此操作") + '</div>' +
        '<div class="in-actions">' +
        '<button class="in-btn primary" id="in-allow">允许一次</button>' +
        (msg.escalationMode ? '<button class="in-btn" id="in-allow-always" title="将会话权限提升为 ' + esc(msg.escalationMode) + '，之后同级别操作不再询问">永久允许</button>' : "") +
        '<button class="in-btn danger" id="in-reject">拒绝</button>' +
        '</div></div>';
    } else {
      var isReview = msg.questions.some(function (q) { return q.intent && q.intent.kind === "plan-review"; });
      var tag = isReview ? '<span class="in-tag">计划审批</span>' : '<span class="in-tag">选择题</span>';
      // Paginated questions: show PER_PAGE per page, prev/next flips in place and
      // PRESERVES state. Each question gets its OWN multi-line custom answer
      // (interactState.custom is a {qi: text} map, not one global string).
      // One question per page; the ONLY secondary action is the ‹ › pager arrows
      // (callers can freely move back/forward). There is no "next" primary button:
      // single-select auto-advances, multi-select/custom advance via the next
      // arrow, and a plain "提交" button appears ONLY on the last question.
      inner = '<div class="in-card"><div class="in-head">' + tag + ' agent 向你提问</div>' +
        '<div id="in-questions"></div>' +
        '<div class="in-actions">' +
        '<button class="in-btn primary" id="in-submit" disabled>提交</button>' +
        '<span class="in-spacer"></span>' +
        '<button class="in-btn" id="in-cancel">取消</button>' +
        '</div></div>';
    }
    interactEl.innerHTML = inner;
    interactEl.hidden = false;
    interactState = {
      kind: msg.kind, rpcId: msg.rpcId, sessionId: msg.sessionId,
      approvalId: msg.approvalId || null,
      selections: {}, custom: {}, skipped: {}, page: 0
    };
    lockMainInput(); // composer takeover while the question is pending
    // wire the buttons
    var allowBtn = $("in-allow");
    if (allowBtn) allowBtn.addEventListener("click", function () { answerInteraction({ outcome: "allowed-once" }); });
    var allowAlwaysBtn = $("in-allow-always");
    if (allowAlwaysBtn) allowAlwaysBtn.addEventListener("click", function () {
      // Answer this request once, then raise the session permission preset to
      // the escalated mode so the same class of operations stops asking.
      answerInteraction({ outcome: "allowed-once", remember: "session", mode: msg.escalationMode });
    });
    var rejectBtn = $("in-reject");
    if (rejectBtn) rejectBtn.addEventListener("click", function () { answerInteraction({ outcome: "rejected" }); });
    var submitBtn = $("in-submit");
    if (submitBtn) submitBtn.addEventListener("click", function () {
      // "提交" only shows on the last question; it ALWAYS submits.
      answerInteraction({ submit: true });
    });
    var cancelBtn2 = $("in-cancel");
    if (cancelBtn2) cancelBtn2.addEventListener("click", function () {
      // Dismissal = a COMPLETED batch of skipped answers (empty selected), the
      // official skip semantics. A waterfall rejection (ASK_CANCELLED) reads
      // to the model as a failed tool call, so it believes the question never
      // reached the user and asks the whole thing again.
      answerInteraction({ submit: true, skipAll: true });
    });
    // If this is a question, render the (paginated) question set now.
    if (msg.kind === "question") {
      renderQuestionPage(msg);
    }
    updateInteractionButtons();
  }

  /* ---------- paginated question rendering (one question per page — mirrors
     the official QuestionComposer, which renders questions[index] one at a
     time. A single-select auto-advances to the next question; the LAST question
     is the submit; multi-select stays and lets the user advance manually.) ---------- */
  var QUESTION_PAGE_SIZE = 1;
  function renderQuestionPage(msg) {
    var qs = (msg && msg.questions) || [];
    var total = qs.length;
    var pages = Math.max(1, Math.ceil(total / QUESTION_PAGE_SIZE));
    if (interactState.page >= pages) interactState.page = pages - 1;
    if (interactState.page < 0) interactState.page = 0;
    var start = interactState.page * QUESTION_PAGE_SIZE;
    var end = Math.min(start + QUESTION_PAGE_SIZE, total);
    var box = $("in-questions");
    if (!box) return;
    var html = "";
    if (pages > 1) {
      html += '<div class="in-pagenav">' +
        '<button class="in-nav" id="in-prev"' + (interactState.page === 0 ? " disabled" : "") + '>‹ 上一页</button>' +
        '<span class="in-page">第 ' + (interactState.page + 1) + ' / ' + pages + ' 页</span>' +
        '<button class="in-nav" id="in-next"' + (interactState.page === pages - 1 ? " disabled" : "") + '>下一页 ›</button>' +
        '</div>';
    }
    for (var qi = start; qi < end; qi++) {
      var q = qs[qi];
      var skipped = !!interactState.skipped[qi];
      html += '<div class="in-q' + (skipped ? " skipped" : "") + '" data-qi="' + qi + '">' +
        '<div class="in-qhead"><div class="in-qtext">' + (pages > 1 ? '[' + (qi + 1) + '] ' : '') + esc(q.question) + '</div>' +
        '<button class="in-skip" data-qi="' + qi + '" title="跳过此题">' + (skipped ? "取消跳过" : "跳过") + '</button></div>' +
        (q.header ? '<div class="in-qheader">' + esc(q.header) + '</div>' : "") +
        (q.detail ? (q.intent && q.intent.kind === "plan-review"
          ? '<div class="in-qdetail in-plan">' + renderMd(q.detail) + '</div>'
          : '<div class="in-qdetail">' + esc(q.detail) + '</div>') : "") +
        '<div class="in-opts">' +
        (q.options || []).map(function (o, oi) {
          var disp = parseRecommendedLabel(o.label);
          if (q.intent && q.intent.kind === "plan-review") {
            // Localized display only; submit still sends the original label
            // (the harness compares against the exact "Approve" string).
            disp = { label: o.label === q.intent.approve ? "批准并退出计划模式" : "继续规划", recommended: disp.recommended };
          }
          var chip = q.multiSelect ? '<span class="in-check">✓</span>' : '<span class="in-num">' + (oi + 1) + '</span>';
          return '<button class="in-opt' + (interactState.selections[qi] && interactState.selections[qi].has(oi) ? " sel" : "") + '" data-qi="' + qi + '" data-oi="' + oi + '">' + chip +
            '<span class="in-ocopy"><span class="in-oline">' +
            '<span class="in-olabel">' + esc(disp.label) + '</span>' +
            (disp.recommended ? '<span class="in-badge">推荐</span>' : "") +
            '</span>' +
            (o.description ? '<span class="in-odesc">' + esc(o.description) + '</span>' : "") +
            '</span></button>';
        }).join("") +
        '</div>' +
        '<div class="in-custom-row">' +
        '<span class="in-custom-icon">✎</span>' +
        '<textarea class="in-custom-input" data-qi="' + qi + '" rows="1" placeholder="自定义回答…（可选，Shift+Enter 换行）">' + esc(interactState.custom[qi] || "") + '</textarea>' +
        '</div>' +
        '</div>';
    }
    box.innerHTML = html;

    // wire pagination
    var prevBtn = $("in-prev"), nextBtn = $("in-next");
    if (prevBtn) prevBtn.addEventListener("click", function () {
      interactState.page--; renderQuestionPage(msg); updateInteractionButtons();
    });
    if (nextBtn) nextBtn.addEventListener("click", function () {
      interactState.page++; renderQuestionPage(msg); updateInteractionButtons();
    });

    // per-question wiring: skip / option / custom
    box.querySelectorAll(".in-skip").forEach(function (b) {
      b.addEventListener("click", function () {
        var qi = b.dataset.qi;
        if (interactState.skipped[qi]) {
          delete interactState.skipped[qi];
          var qEl = box.querySelector('.in-q[data-qi="' + qi + '"]');
          if (qEl) qEl.classList.remove("skipped");
          b.textContent = "跳过";
        } else {
          interactState.skipped[qi] = true;
          var sel = interactState.selections[qi];
          if (sel) sel.clear();
          var qEl2 = box.querySelector('.in-q[data-qi="' + qi + '"]');
          if (qEl2) {
            qEl2.classList.add("skipped");
            qEl2.querySelectorAll(".in-opt").forEach(function (x) { x.classList.remove("sel"); });
            var custEl = qEl2.querySelector(".in-custom-input");
            if (custEl) custEl.value = "";
          }
          b.textContent = "取消跳过";
        }
        updateInteractionButtons();
      });
    });
    box.querySelectorAll(".in-opt").forEach(function (b) {
      b.addEventListener("click", function () {
        var qi = b.dataset.qi, oi = b.dataset.oi;
        var q = qs[Number(qi)];
        if (interactState.skipped[qi]) return; // skipped → no edits
        var sel = interactState.selections[qi] || (interactState.selections[qi] = new Set());
        if (sel.has(oi)) { sel.delete(oi); b.classList.remove("sel"); }
        else {
          if (!q.multiSelect) {
            sel.clear();
            box.querySelectorAll('.in-opt[data-qi="' + qi + '"]').forEach(function (x) { x.classList.remove("sel"); });
            // single-select picking an option clears this question's custom answer
            interactState.custom[qi] = "";
            var custEl = box.querySelector('.in-q[data-qi="' + qi + '"] .in-custom-input');
            if (custEl) custEl.value = "";
          }
          sel.add(oi); b.classList.add("sel");
          // Single-select: mirror the official composer — auto-advance to the
          // next question (unless this is the last one, which is the submit).
          if (!q.multiSelect && qi < qs.length - 1) {
            interactState.page++;
            renderQuestionPage(msg);
            return;
          }
        }
        updateInteractionButtons();
      });
    });
    box.querySelectorAll(".in-custom-input").forEach(function (ta) {
      ta.addEventListener("input", function () {
        if (!interactState.custom) interactState.custom = {};
        var qi = ta.dataset.qi;
        interactState.custom[qi] = ta.value;
        var q = qs[Number(qi)];
        // single-select: a non-empty custom answer clears the picked option
        if (ta.value.trim() !== "" && q && !q.multiSelect) {
          var sel = interactState.selections[qi];
          if (sel) {
            sel.clear();
            box.querySelectorAll('.in-opt[data-qi="' + qi + '"]').forEach(function (x) { x.classList.remove("sel"); });
          }
        }
        updateInteractionButtons();
      });
      ta.addEventListener("keydown", function (e) {
        // Enter advances to the next question (Shift+Enter newline); on the last
        // question it submits. Mirrors the pager arrow / single-select behavior.
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          var qsK = (state.interact && state.interact.questions) || [];
          var pagesK = Math.max(1, Math.ceil(qsK.length / QUESTION_PAGE_SIZE));
          if (interactState.page >= pagesK - 1) { answerInteraction({ submit: true }); }
          else { interactState.page++; renderQuestionPage(state.interact); updateInteractionButtons(); }
        }
      });
    });
    updateInteractionButtons();
  }
  function answerInteraction(ans) {
    var st = interactState;
    if (!st) return;
    if (ans.outcome) {
      var approvalPayload = { type: "respondApproval", rpcId: st.rpcId, sessionId: st.sessionId, approvalId: st.approvalId, outcome: ans.outcome };
      if (ans.remember) approvalPayload.remember = ans.remember;
      if (ans.mode) approvalPayload.mode = ans.mode;
      post(approvalPayload);
    } else if (ans.submit) {
      var answers = [];
      // build from the message's questions (keep original order)
      var qs = state.interact && state.interact.questions || [];
      qs.forEach(function (q, qi) {
        // skipped question: empty answer (web composer sends {id, selected:[]})
        if (ans.skipAll || (st.skipped && st.skipped[qi])) {
          answers.push({ id: q.id, selected: [] });
          return;
        }
        var selSet = st.selections[qi];
        var selected = selSet ? Array.from(selSet).map(function (oi) {
          var o = q.options[Number(oi)];
          return o ? o.label : "";
        }).filter(Boolean) : [];
        // Per-question custom answer (st.custom is a {qi: text} map).
        var custom = (st.custom && st.custom[qi] ? st.custom[qi] : "").trim();
        // Web composer semantics: on a single-select, a custom answer REPLACES
        // the picked option (selected:[], custom); multi-select keeps both.
        if (custom !== "" && q.multiSelect !== true) selected = [];
        if (selected.length || custom) answers.push({ id: q.id, selected: selected, ...(custom ? { custom } : {}) });
      });
      post({ type: "respondQuestion", rpcId: st.rpcId, sessionId: st.sessionId, answers: answers });
    }
    state.interact = null;
    interactEl.hidden = true;
    interactState = null;
    unlockMainInput(); // composer released
  }

  /* ---------- metrics line under the input (mirrors the DSH web StatsLine) ---------- */
  // Compact duration: 45.2s under a minute (integer seconds keep the .0), 2m42s from there on.
  function fmtDur(ms) {
    var s = (ms || 0) / 1e3;
    if (s < 60) return (Math.round(s * 10) / 10).toFixed(1) + "s";
    var whole = Math.round(s);
    return Math.floor(whole / 60) + "m" + (whole % 60) + "s";
  }
  // Compact token count: 517 / 12.2K / 517K / 1.2M (one decimal under three digits).
  function fmtTok(n) {
    var scaled = function (v) { return v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10); };
    if (n < 1e3) return String(n);
    if (n < 1e6) return scaled(n / 1e3) + "K";
    return scaled(n / 1e6) + "M";
  }
  // Tokens/sec: whole tokens from ten up, one decimal below.
  function fmtTps(tps) {
    var c = Math.max(0, tps);
    return c >= 10 ? String(Math.round(c)) : String(Math.round(c * 10) / 10);
  }
  function updateStatusLine() {
    if (!state.connected) { statusEl.textContent = ""; return; }
    var groups = [];
    var act = state.sessions.find(function (x) { return x.sessionId === state.activeSessionId; });
    var ring = "";
    var ctx = act && act.context;
    if (ctx && typeof ctx.contextWindow === "number") {
      var used = ctx.projectedTokens != null ? ctx.projectedTokens : ctx.pressureTokens;
      if (typeof used === "number") {
        var pct = Math.min(100, Math.round((used / ctx.contextWindow) * 100));
        var R = 5, C = 2 * Math.PI * R;
        var frac = Math.max(0.02, pct / 100);
        var col = pct >= 90 ? "var(--err)" : pct >= 70 ? "#e0b94a" : "var(--ok)";
        ring = "<span title='上下文占用 ~" + fmtTok(used) + " / " + fmtTok(ctx.contextWindow) + " tok' style='white-space:nowrap;vertical-align:middle'>" +
          "<svg width='13' height='13' viewBox='0 0 14 14' style='vertical-align:-2px;margin-right:3px'>" +
          "<circle cx='7' cy='7' r='" + R + "' fill='none' stroke='var(--border)' stroke-width='2'/>" +
          "<circle cx='7' cy='7' r='" + R + "' fill='none' stroke='" + col + "' stroke-width='2' stroke-linecap='round' " +
          "stroke-dasharray='" + (frac * C).toFixed(2) + " " + C.toFixed(2) + "' transform='rotate(-90 7 7)'/>" +
          "</svg>" + pct + "% · " + fmtTok(used) + "</span>";
      }
    }
    var st = act && act.stats;
    if (st && st.steps > 0) {
      groups.push((st.turns || 0) + " 轮 · " + st.steps + " 步");
      var durations = [];
      if (st.llmMs > 0) durations.push("LLM " + fmtDur(st.llmMs));
      if (st.toolMs > 0) durations.push("工具调用 " + fmtDur(st.toolMs));
      if (durations.length > 0) groups.push(durations.join(" · "));
      var speeds = [];
      if (st.ttftSteps > 0) speeds.push("首 token 平均 " + fmtDur(st.ttftMs / st.ttftSteps));
      if (st.decodeMs > 0) speeds.push(fmtTps(st.decodeTokens / (st.decodeMs / 1e3)) + " tok/s");
      if (speeds.length > 0) groups.push(speeds.join(" · "));
    }
    var u = state.usage;
    if (u) {
      var billed = (u.uncachedInputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
      if (billed > 0 && typeof u.cacheReadTokens === "number") {
        groups.push("缓存命中 " + Math.round((u.cacheReadTokens / billed) * 100) + "%");
      }
      groups.push("输入 " + fmtTok(billed) + " tok · 输出 " + fmtTok(u.outputTokens || 0) + " tok");
    }
    var liveSpeed = "";
    if (state.running && state.firstTokenTime) {
      var elapsed = (Date.now() - state.firstTokenTime) / 1000;
      if (elapsed > 0.3 && state.turnOutput > 0) liveSpeed = fmtTps(state.turnOutput / elapsed) + " tok/s";
    }
    // Single summary row: the context-usage ring heads it, live speed and the
    // session stats follow. The live clock / first-token figures stay off this
    // row on purpose — per-turn summaries carry the final numbers.
    var tail = [];
    if (ring) tail.push("<span class='st-i'>" + ring + "</span>");
    if (liveSpeed) tail.push("<span class='st-i'>" + liveSpeed + "</span>");
    groups.forEach(function (g) { tail.push("<span class='st-i'>" + esc(g) + "</span>"); });
    statusEl.innerHTML = tail.join("");
  }

  /* ---------- input ---------- */
  var history = [], historyIndex = -1, historyDraft = ""; // CLI-style ↑/↓ history
  var INPUT_MIN_LINES = 5, INPUT_MAX_LINES = 10;
  function autoGrow() {
    inputEl.style.height = "auto";
    // Size from the textarea's own computed box (line-height/padding/border):
    // starts at 5 lines, grows with the text up to 10 lines, then scrolls.
    var cs = getComputedStyle(inputEl);
    var line = parseFloat(cs.lineHeight);
    if (!isFinite(line) || line <= 0) line = (parseFloat(cs.fontSize) || 13) * 1.4;
    var bt = parseFloat(cs.borderTopWidth) || 0, bb = parseFloat(cs.borderBottomWidth) || 0;
    // border-box: the box adds padding+border on top of the text; scrollHeight
    // already includes padding, so only the borders are added back here.
    var box = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0) + bt + bb;
    var min = line * INPUT_MIN_LINES + box;
    var max = line * INPUT_MAX_LINES + box;
    inputEl.style.height = Math.max(min, Math.min(inputEl.scrollHeight + bt + bb, max)) + "px";
    // The footer grows upward; if the message area was pinned to the bottom,
    // keep it pinned so the newest content (incl. turn summaries) stays visible.
    if (nearBottom()) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  inputEl.addEventListener("input", function () { autoGrow(); maybeTriggerMention(); });
  inputEl.addEventListener("keydown", function (e) {
    if (menuActive) {
      if (e.key === "ArrowDown") { e.preventDefault(); menuIndex = Math.min(menuIndex + 1, menuItems.length - 1); drawMenu(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); menuIndex = Math.max(menuIndex - 1, 0); drawMenu(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); if (currentDir !== "") { currentDir = dirParent(currentDir); refreshMentionMenu(); } return; }
      if (e.key === "ArrowRight") {
        e.preventDefault();
        var sel = menuItems[menuIndex];
        if (sel && sel.kind === "dir") { currentDir = sel.rel; refreshMentionMenu(); }
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        var it = menuItems[menuIndex];
        if (!it) { hideMenu(); return; }
        if (it.kind === "up") { currentDir = dirParent(currentDir); refreshMentionMenu(); }
        else if (it.kind === "dir") { currentDir = it.rel; refreshMentionMenu(); }
        else if (it.kind === "file") insertMention(it.rel, false);
        else if (it.kind === "slash") runSlash(it.cmd);
        else hideMenu();
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); hideMenu(); return; }
    }
    if (e.key === "ArrowUp" && history.length > 0) {
      e.preventDefault();
      if (historyIndex === -1) { historyDraft = inputEl.value; historyIndex = 0; }
      else historyIndex = Math.min(historyIndex + 1, history.length - 1);
      inputEl.value = history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "ArrowDown") {
      if (historyIndex === -1) return; // not navigating yet — keep default caret behavior
      e.preventDefault();
      historyIndex--;
      inputEl.value = historyIndex === -1 ? historyDraft : history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener("click", send);
  var footerEl = document.querySelector("footer");
  // Anchor a popup above its trigger button (footer is position: relative).
  function anchorMenu(menu, btn) {
    try {
      var f = footerEl.getBoundingClientRect();
      var b = btn.getBoundingClientRect();
      menu.style.left = Math.max(0, b.left - f.left) + "px";
      menu.style.right = "auto";
    } catch (e) { /* fall back to CSS default */ }
  }
  function openMenu(menu, btn, render) {
    permMenuEl.hidden = true;
    planMenuEl.hidden = true;
    modelMenuEl.hidden = true;
    effortMenuEl.hidden = true;
    render();
    anchorMenu(menu, btn);
    menu.hidden = false;
  }
  permBtnEl.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (permMenuEl.hidden) openMenu(permMenuEl, permBtnEl, renderPermMenu);
    else permMenuEl.hidden = true;
  });
  planBtnEl.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (planMenuEl.hidden) openMenu(planMenuEl, planBtnEl, renderPlanMenu);
    else planMenuEl.hidden = true;
  });
  modelBtnEl.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (modelMenuEl.hidden) openMenu(modelMenuEl, modelBtnEl, renderModelMenu);
    else modelMenuEl.hidden = true;
  });
  effortBtnEl.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (effortMenuEl.hidden) openMenu(effortMenuEl, effortBtnEl, renderEffortMenu);
    else effortMenuEl.hidden = true;
  });
  settingsBtnEl.addEventListener("click", function () { post({ type: "openSettings" }); });
  // click anywhere outside the popups closes them
  document.addEventListener("click", function (ev) {
    if (permMenuEl.hidden && planMenuEl.hidden && modelMenuEl.hidden && effortMenuEl.hidden && selMenuEl.hidden) return;
    var t = ev.target;
    if (t && t.closest &&
        (t.closest("#perm-menu") || t.closest("#perm-btn") ||
         t.closest("#plan-menu") || t.closest("#plan-btn") ||
         t.closest("#model-menu") || t.closest("#model-btn") ||
         t.closest("#effort-menu") || t.closest("#effort-btn") ||
         t.closest("#session-menu") || t.closest("#session-btn"))) return;
    permMenuEl.hidden = true;
    planMenuEl.hidden = true;
    modelMenuEl.hidden = true;
    effortMenuEl.hidden = true;
    selMenuEl.hidden = true;
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      permMenuEl.hidden = true; planMenuEl.hidden = true; modelMenuEl.hidden = true; effortMenuEl.hidden = true;
      selMenuEl.hidden = true;
    }
  });
  // Pull the permission presets once the panel is live (composer left button).
  post({ type: "getPermissions" });

  /* ---------- image attachments (Ctrl+V paste) ---------- */
  var attachments = [];
  /**
   * Draft rail, mirroring the official AttachmentRail: 64×64 rounded tiles in a
   * horizontal rail, hover-revealed remove (always on for coarse pointers), and
   * a click that opens the full-size lightbox. Captions live in the tooltip —
   * the point is to RECOGNIZE the picture, which a 22px chip never allowed.
   */
  function renderAttachments() {
    attachEl.innerHTML = "";
    if (!attachments.length) { attachEl.hidden = true; attachEl.classList.remove("has-images"); return; }
    attachEl.hidden = false;
    // The strip grows to thumbnail height when images are present; file chips
    // follow along (taller chip + large icon).
    attachEl.classList.toggle("has-images", attachments.some(function (a) { return a.kind !== "file"; }));
    attachments.forEach(function (a, i) {
      var item = document.createElement("div");
      item.className = "attach-item";
      if (a.kind === "file") {
        // Non-image file: a named chip instead of a thumbnail.
        item.className = "attach-item attach-file";
        var chip = document.createElement("div");
        chip.className = "attach-file-chip";
        chip.title = (a.name || "文件") + " · " + fmtBytes(a.size || 0);
        var icEl = document.createElement("span");
        icEl.className = "af-icon";
        icEl.textContent = "📄";
        var metaEl = document.createElement("span");
        metaEl.className = "af-meta";
        var nmEl = document.createElement("span");
        nmEl.className = "af-name";
        nmEl.textContent = a.name || "文件";
        var szEl = document.createElement("span");
        szEl.className = "af-size";
        szEl.textContent = fmtBytes(a.size || 0);
        metaEl.appendChild(nmEl);
        metaEl.appendChild(szEl);
        chip.appendChild(icEl);
        chip.appendChild(metaEl);
        var fx = document.createElement("button");
        fx.type = "button";
        fx.className = "attach-x";
        fx.textContent = "×";
        fx.title = "移除这个文件";
        fx.onclick = function (idx) {
          return function (ev) {
            if (ev) ev.stopPropagation();
            attachments.splice(idx, 1);
            renderAttachments();
          };
        }(i);
        item.appendChild(chip);
        item.appendChild(fx);
        attachEl.appendChild(item);
        return;
      }
      var src = "data:" + a.mediaType + ";base64," + a.data;
      var caption = a.name || (a.mediaType.replace("image/", "") + " 图片");
      var thumb = document.createElement("button");
      thumb.type = "button";
      thumb.className = "attach-thumb";
      thumb.title = caption + " · 点击放大";
      var img = document.createElement("img");
      img.src = src;
      thumb.appendChild(img);
      thumb.onclick = function () { openLightbox(src, caption); };
      var x = document.createElement("button");
      x.type = "button";
      x.className = "attach-x";
      x.textContent = "×";
      x.title = "移除这张图";
      x.onclick = function (idx) {
        return function (ev) {
          if (ev) ev.stopPropagation();
          attachments.splice(idx, 1);
          renderAttachments();
        };
      }(i);
      item.appendChild(thumb);
      item.appendChild(x);
      attachEl.appendChild(item);
    });
  }

  /* ---------- full-size preview (official ImageLightbox) ---------- */
  var lightboxEl = null;
  function openLightbox(src, caption) {
    if (!src) return;
    if (!lightboxEl) {
      lightboxEl = document.createElement("div");
      lightboxEl.id = "lightbox";
      lightboxEl.hidden = true;
      var mask = document.createElement("div");
      mask.className = "lb-mask";
      var lbImg = document.createElement("img");
      lbImg.className = "lb-img";
      var close = document.createElement("button");
      close.type = "button";
      close.className = "lb-close";
      close.textContent = "✕";
      close.title = "关闭（Esc）";
      var cap = document.createElement("div");
      cap.className = "lb-cap";
      lightboxEl.appendChild(mask);
      lightboxEl.appendChild(lbImg);
      lightboxEl.appendChild(close);
      lightboxEl.appendChild(cap);
      document.body.appendChild(lightboxEl);
      mask.onclick = function () { closeLightbox(); };
      close.onclick = function () { closeLightbox(); };
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && lightboxEl && !lightboxEl.hidden) closeLightbox();
      });
    }
    lightboxEl.querySelector(".lb-img").src = src;
    lightboxEl.querySelector(".lb-cap").textContent = caption || "";
    lightboxEl.hidden = false;
  }
  function closeLightbox() {
    if (!lightboxEl || lightboxEl.hidden) return;
    lightboxEl.hidden = true;
    lightboxEl.querySelector(".lb-img").src = "";
  }
  /* ---------- composer attachments: paste, drag-drop, file picker ----------
     Images ride the prompt inline (harness admission); non-image files are
     uploaded once (fileUploads/upload) and referenced by receipt. Dropped
     Explorer files arrive as file:// paths with no bytes — the host reads
     them (readAttachmentFile) and answers attachmentFileRead. */
  var MAX_ATTACH_IMAGE_BYTES = 10 * 1024 * 1024;
  var MAX_ATTACH_FILE_BYTES = 25 * 1024 * 1024;
  var attachmentReadWaiters = {};
  var attachReadSeq = 1;
  function readToAttachment(file, kind) {
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || "");
      var comma = result.indexOf(",");
      if (comma < 0) return;
      if (kind === "file") {
        attachments.push({ kind: "file", mediaType: file.type || "application/octet-stream",
                           data: result.slice(comma + 1), name: file.name || "文件", size: file.size });
      } else {
        attachments.push({ kind: "image", mediaType: file.type,
                           data: result.slice(comma + 1), name: file.name || "", size: file.size });
      }
      renderAttachments();
    };
    reader.readAsDataURL(file);
  }
  function addAttachmentFiles(files) {
    Array.prototype.forEach.call(files || [], function (file) {
      if (!file) return;
      var isImg = /^image\/(png|jpeg|webp|gif)$/.test(file.type || "");
      var limit = isImg ? MAX_ATTACH_IMAGE_BYTES : MAX_ATTACH_FILE_BYTES;
      if (file.size > limit) {
        statusEl.textContent = (isImg ? "图片" : "文件") + "过大（>" + Math.round(limit / (1024 * 1024)) + "MB）：" + (file.name || "");
        return;
      }
      readToAttachment(file, isImg ? "image" : "file");
    });
  }
  inputEl.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === "file") {
        var file = it.getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length) { e.preventDefault(); addAttachmentFiles(files); }
  });
  var attachBtn = $("attach-btn");
  var attachFileEl = $("attach-file");
  if (attachBtn && attachFileEl) {
    attachBtn.addEventListener("click", function (ev) {
      if (ev) ev.stopPropagation();
      attachFileEl.click();
    });
    attachFileEl.addEventListener("change", function () {
      addAttachmentFiles(attachFileEl.files);
      attachFileEl.value = "";
    });
  }
  // Drag-and-drop: system drops carry File objects; VS Code Explorer drops
  // carry file:// URIs instead — those go through the host file reader.
  // Webview-hardened state machine: only a dragleave whose relatedTarget is
  // truly outside the window hides the outline (child enter/leave pairs move
  // the pointer within the page and used to flicker it off); dragover
  // self-heals a lost dragleave, and drop/dragend always reset.
  var dropDepth = 0;
  function normDragTypes(e) {
    var out = [];
    var types = e.dataTransfer && e.dataTransfer.types;
    if (types) for (var i = 0; i < types.length; i++) out.push(String(types[i]).toLowerCase());
    return out;
  }
  function dragLooksDroppable(e) {
    var types = normDragTypes(e);
    // Explorer drags arrive as uri-list flavors, OS file drags as "files".
    // Some hosts expose an empty type list during enter/over — accept anyway;
    // the drop handler decides whether anything is actually usable.
    if (types.length === 0) return true;
    for (var i = 0; i < types.length; i++) {
      var t = types[i];
      // uri flavors: OS/Explorer file drops. "resource"/vnd.code.*: VS Code's
      // own Explorer tree drags (ResourceURLs payload, JSON list of file URIs).
      if (t === "files" || t.indexOf("uri-list") >= 0 || t.indexOf("resource") >= 0 ||
          t.indexOf("application/vnd.code") >= 0) return true;
    }
    return false;
  }
  function setDropping(on) {
    if (on) document.body.classList.add("dropping");
    else document.body.classList.remove("dropping");
  }
  function fileUriToPath(line) {
    var p = line.replace(/^file:\/+/i, "");
    try { p = decodeURIComponent(p); } catch (err) {}
    return p.replace(/^\/([A-Za-z]:)/, "$1");
  }
  function attachPathLines(raw) {
    var text = String(raw || "").trim();
    // VS Code Explorer drags carry "ResourceURLs": a JSON array of file URIs.
    if (text.charAt(0) === "[") {
      try {
        var arr = JSON.parse(text);
        if (Array.isArray(arr)) {
          var joined = arr.filter(function (u) { return typeof u === "string"; }).join("\n");
          if (joined) return attachPathLines(joined);
        }
      } catch (err) { /* not JSON — fall through to plain line parsing */ }
    }
    var handled = false;
    (raw || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line || line.charAt(0) === "#") return;
      var p = "";
      if (/^file:\/\//i.test(line)) p = fileUriToPath(line);
      else if (/^[A-Za-z]:[\\/]/.test(line) || /^\\\\/.test(line)) p = line;
      if (!p) return;
      handled = true;
      var reqId = attachReadSeq++;
      attachmentReadWaiters[reqId] = true;
      post({ type: "readAttachmentFile", requestId: reqId, path: p.replace(/\//g, "\\") });
    });
    return handled;
  }
  // Window-level capture: survives any intermediate stopPropagation and reaches
  // the events even when the pointer sits on the textarea or a button.
  // VS Code's webview host hijacks file drags at dragenter: its inner host
  // posts drag-start to the shell (only when the event was NOT marked handled)
  // and the shell then sets this iframe pointer-events:none until the drag
  // ends — the panel would see one dragenter and nothing else (the "flash").
  // preventDefault() flips that official guard; stopImmediatePropagation()
  // additionally guarantees the host's bubble-phase listener never runs in
  // this dispatch, whatever the listener registration order.
  var dragHintEl = $("drag-hint");
  var dragHintTimer = null;
  function dragHint(text) {
    if (!dragHintEl) return;
    if (dragHintTimer) { clearTimeout(dragHintTimer); dragHintTimer = null; }
    if (text) {
      dragHintEl.textContent = text;
      dragHintEl.hidden = false;
      dragHintTimer = setTimeout(function () { dragHintEl.hidden = true; dragHintTimer = null; }, 5000);
    } else {
      dragHintEl.hidden = true;
      dragHintEl.textContent = "";
    }
  }
  window.addEventListener("dragenter", function (e) {
    if (!dragLooksDroppable(e)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    dropDepth++;
    setDropping(true);
    dragHint("拖入检测 " + (normDragTypes(e).join(",") || "(无类型)"));
  }, true);
  window.addEventListener("dragover", function (e) {
    if (!dragLooksDroppable(e)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.dataTransfer) { try { e.dataTransfer.dropEffect = "copy"; } catch (err) {} }
    dropDepth = Math.max(dropDepth, 1);
    setDropping(true);
  }, true);
  window.addEventListener("dragleave", function (e) {
    var to = e.relatedTarget;
    if (to && document.documentElement.contains(to)) return; // still inside the page
    dropDepth = 0;
    setDropping(false);
  }, true);
  window.addEventListener("dragend", function () {
    dropDepth = 0;
    setDropping(false);
    dragHint(null);
  }, true);
  window.addEventListener("drop", function (e) {
    e.stopImmediatePropagation();
    dropDepth = 0;
    setDropping(false);
    dragHint(null);
    if (!e.dataTransfer) return;
    var dropped = e.dataTransfer.files;
    if (dropped && dropped.length) { e.preventDefault(); addAttachmentFiles(dropped); return; }
    // Some drag sources populate only the DataTransferItemList entries.
    var items = e.dataTransfer.items;
    if (items && items.length) {
      var fromItems = [];
      for (var k = 0; k < items.length; k++) {
        if (items[k].kind === "file") { var f = items[k].getAsFile(); if (f) fromItems.push(f); }
      }
      if (fromItems.length) { e.preventDefault(); addAttachmentFiles(fromItems); return; }
    }
    // Explorer / host paths: sweep every offered flavor — uri/text flavors
    // first, then any remaining custom type (VS Code ResourceURLs rides one).
    var handled = false;
    var types = e.dataTransfer.types || [];
    var order = [], tail = [];
    for (var i = 0; i < types.length; i++) {
      var name = String(types[i]);
      var lower = name.toLowerCase();
      if (lower === "files") continue;
      if (lower.indexOf("uri-list") >= 0 || lower.indexOf("resource") >= 0 ||
          lower === "text/plain" || lower === "text") order.push(name);
      else tail.push(name);
    }
    order = order.concat(tail);
    for (var j = 0; j < order.length && !handled; j++) {
      try { handled = attachPathLines(e.dataTransfer.getData(order[j])); } catch (err) {}
    }
    if (!handled) {
      // Last resort: some drag sources only expose the default text flavor.
      try { handled = attachPathLines(e.dataTransfer.getData("text")); } catch (err) {}
    }
    if (handled) {
      e.preventDefault();
    } else if (types.length > 0) {
      var shown = Array.prototype.slice.call(types).join(", ");
      statusEl.textContent = "拖入内容无法识别（" + shown + "）";
    }
  }, true);

  function send() {
    var text = inputEl.value.trim();
    if (!text && attachments.length === 0) return;
    // While the agent is running, Enter queues the message (harness queue);
    // cap the pending queue at 4. Slash commands never queue — they execute
    // immediately via commands/execute, so they skip the cap (and must, so a
    // typed "/compact" can't be blocked by the queue).
    if (text && state.running && !(text.startsWith("/") && attachments.length === 0)) {
      var queued = state.queue.filter(function (it) { return it.placement === "queued"; }).length;
      if (queued >= 4) {
        statusEl.textContent = "队列已满（最多 4 条）";
        return;
      }
    }
    hideMenu();
    // Pending sends do NOT get an optimistic transcript bubble: parking one
    // mid-flow made the running turn look truncated (its stream kept updating
    // above the parked bubble while later tool cards appended below it). The
    // queue strip above the input is the only pending view; the bubble enters
    // the transcript when the harness delivers the message for real.
    post({ type: "send", text: text, attachments: attachments.slice(), mode: "queue" });
    var fileCount = attachments.filter(function (a) { return a.kind === "file"; }).length;
    history.push(text || (fileCount ? ("📎 " + fileCount + " 个附件") : ("📷 " + attachments.length + " 张图片")));
    if (history.length > 200) history.shift();
    historyIndex = -1;
    historyDraft = "";
    attachments = [];
    renderAttachments();
    inputEl.value = "";
    autoGrow();
  }
  cancelBtn.addEventListener("click", function () { post({ type: "cancel" }); });
  if (todoToggleEl) todoToggleEl.addEventListener("click", function () {
    state.todoOpen = !state.todoOpen;
    renderTodos(); // rebuilds the list + chevron in the new state
  });
  selBtnEl.addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (selMenuEl.hidden) { renderSessionMenu(); selMenuEl.hidden = false; }
    else selMenuEl.hidden = true;
  });
  $("new-session").addEventListener("click", function () {
    if (modeMenuOpen) closeModeMenu(); else openModeMenu();
  });
  $("workspace-btn").addEventListener("click", function () {
    post({ type: "pickWorkspace" });
  });
  updateWorkspaceLine();
  var delBtn = $("delete-session");
  delBtn.addEventListener("click", function () {
    if (!state.activeSessionId) return;
    if (delBtn.dataset.arm === "1") {
      delete delBtn.dataset.arm;
      delBtn.textContent = "归档";
      post({ type: "deleteSession", sessionId: state.activeSessionId });
    } else {
      delBtn.dataset.arm = "1";
      delBtn.textContent = "确认归档";
      setTimeout(function () { delete delBtn.dataset.arm; delBtn.textContent = "归档"; }, 3000);
    }
  });
  var hardDelBtn = $("delete-session-hard");
  hardDelBtn.addEventListener("click", function () {
    if (!state.activeSessionId) return;
    if (hardDelBtn.dataset.arm === "1") {
      delete hardDelBtn.dataset.arm;
      hardDelBtn.textContent = "彻底删除";
      post({ type: "deletePermanently", sessionId: state.activeSessionId });
    } else {
      hardDelBtn.dataset.arm = "1";
      hardDelBtn.textContent = "确认彻底删除";
      setTimeout(function () { delete hardDelBtn.dataset.arm; hardDelBtn.textContent = "彻底删除"; }, 3000);
    }
  });

  /* ---------- custom context menu (Chinese; right-click copy works) ---------- */
  var ctxMenuEl = null;
  function hideCtxMenu() {
    if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; }
  }
  function plainTextOf(node) {
    var clone = node.cloneNode(true);
    clone.querySelectorAll(".msg-actions, .live-timer").forEach(function (n) { n.remove(); });
    return (clone.innerText || clone.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
  }
  function conversationText() {
    var parts = [];
    state.items.forEach(function (it) {
      if (it.kind === "user" && it.text) parts.push("我: " + it.text);
      else if (it.kind === "assistant") {
        var t = (it.blocks || []).filter(function (b) { return b.type === "text"; })
          .map(function (b) { return b.text; }).join("\n").trim();
        if (t) parts.push("DSH: " + t);
      } else if (it.kind === "tool") {
        parts.push("[工具] " + it.name + (it.resultText ? "\n" + it.resultText : ""));
      }
    });
    return parts.join("\n\n");
  }
  function pasteIntoInput() {
    var insert = function (text) {
      if (!text) return;
      var s = inputEl.selectionStart || 0, e2 = inputEl.selectionEnd || 0;
      inputEl.setRangeText(text, s, e2, "end");
      inputEl.dispatchEvent(new Event("input"));
    };
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(insert).catch(function () {
        inputEl.focus();
        document.execCommand("paste");
      });
    } else {
      inputEl.focus();
      document.execCommand("paste");
    }
  }
  function showCtxMenu(x, y, items) {
    hideCtxMenu();
    var menu = document.createElement("div");
    menu.className = "ctx-menu";
    items.forEach(function (it) {
      if (it.sep) { var sp = document.createElement("div"); sp.className = "ctx-sep"; menu.appendChild(sp); return; }
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = it.label;
      if (it.disabled) { b.className = "ctx-item dis"; b.disabled = true; }
      else {
        b.className = "ctx-item";
        b.addEventListener("click", function () { hideCtxMenu(); it.run(); });
      }
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    menu.style.left = Math.max(2, Math.min(x, window.innerWidth - menu.offsetWidth - 4)) + "px";
    menu.style.top = Math.max(2, Math.min(y, window.innerHeight - menu.offsetHeight - 4)) + "px";
    ctxMenuEl = menu;
  }
  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    var items = [];
    if (e.target === inputEl) {
      var hasSel = inputEl.selectionStart !== inputEl.selectionEnd;
      items.push({ label: "剪切", disabled: !hasSel, run: function () { inputEl.focus(); document.execCommand("cut"); } });
      items.push({ label: "复制", disabled: !hasSel, run: function () { inputEl.focus(); document.execCommand("copy"); } });
      items.push({ label: "粘贴", run: pasteIntoInput });
      items.push({ label: "全选", run: function () { inputEl.focus(); inputEl.select(); } });
    } else {
      var selText = String(window.getSelection ? window.getSelection() : "");
      var msgEl = e.target && e.target.closest ? e.target.closest(".msg") : null;
      items.push({ label: "复制选中内容", disabled: !selText, run: function () { post({ type: "copyText", text: selText }); } });
      if (msgEl) items.push({ label: "复制本条消息", run: function () { post({ type: "copyText", text: plainTextOf(msgEl) }); } });
      items.push({ sep: true });
      items.push({ label: "复制整个对话", run: function () { post({ type: "copyText", text: conversationText() }); } });
      items.push({ label: "全选对话", run: function () {
        var sel = window.getSelection();
        if (!sel) return;
        sel.removeAllRanges();
        var r = document.createRange();
        r.selectNodeContents(messagesEl);
        sel.addRange(r);
      } });
    }
    showCtxMenu(e.clientX, e.clientY, items);
  });
  document.addEventListener("mousedown", function (e) {
    if (ctxMenuEl && !ctxMenuEl.contains(e.target)) hideCtxMenu();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") hideCtxMenu();
  }, true);
  window.addEventListener("blur", hideCtxMenu);

  /* Report this webview's width so the host can size the ask-window column
     to match the sidebar (throttled; ignored before the first paint). */
  var widthTimer = null;
  function reportPanelWidth() {
    var px = Math.round(document.body.clientWidth || window.innerWidth || 0);
    if (px > 0) post({ type: "panelWidth", px: px });
  }
  window.addEventListener("resize", function () {
    if (widthTimer) clearTimeout(widthTimer);
    widthTimer = setTimeout(reportPanelWidth, 300);
  });
  setTimeout(reportPanelWidth, 600);

  post({ type: "ready" });
})();
</script>
</body>
</html>
