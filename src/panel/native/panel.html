    if (item.status === "running" && state.activeRound && state.activeRound.kind === "tool" && state.activeRound.callId === item.callId) {
      var tlt = document.createElement("span");
      tlt.className = "live-timer";
      tlt.dataset.start = String(item.startTime || 0);
      tlt.textContent = item.startTime ? fmtLive(Date.now() - item.startTime) : fmtLive(0);
      sum.appendChild(tlt);
    }
    // Never auto-open: only the user's own click expands a tool card.
    var oldB = det.querySelectorAll(".targs");
    for (var b = 0; b < oldB.length; b++) oldB[b].remove();
    if (item.argsText) det.appendChild(toolBlock("参数", item.argsText));
    if (item.resultText) det.appendChild(toolBlock("结果", item.resultText));
  }
  function toolBlock(label, text) {
    var w = document.createElement("div");
    w.className = "targs";
    var lab = document.createElement("div");
    lab.className = "tlabel";
    lab.textContent = label;
    var pre = document.createElement("pre");
    pre.textContent = text;
    var cp = document.createElement("button");
    cp.className = "block-copy";
    cp.textContent = "⧉ 复制";
    cp.title = "复制 " + label;
    cp.onclick = function () { post({ type: "copyText", text: text }); };
    w.appendChild(lab);
    w.appendChild(pre);
    // Anchor the copy button INSIDE the relative pre (`.tool pre` is position:
    // relative); as a sibling of an absolute-elsewhere container it would
    // escape to the card corner and render as an orphan "⧉ 复制".
    pre.appendChild(cp);
    return w;
  }
  function emptyDiv(html) { var d = document.createElement("div"); d.className = "empty"; d.innerHTML = html; return d; }

  /* ---------- bridge metrics: diff chips + live timers ---------- */
  function diffChipHtml(d, pop) {
    if (!d || (d.added === 0 && d.deleted === 0)) return "";
    return "<span class='diff-chip" + (pop ? " pop" : "") + "'>" +
      "<span class='da'>+" + d.added + "</span><span class='dd'>-" + d.deleted + "</span></span>";
  }
  function diffChipEl(d, pop) {
    var w = document.createElement("span");
    w.className = "diff-chip" + (pop ? " pop" : "");
    var a = document.createElement("span");
    a.className = "da";
    a.textContent = "+" + d.added;
    var del = document.createElement("span");
    del.className = "dd";
    del.textContent = "-" + d.deleted;
    w.appendChild(a);
    w.appendChild(del);
    return w;
  }
  // Live format: 12.3s under a minute (integer seconds keep the .0), 1m23s from there on.
  function fmtLive(ms) {
    var s = Math.max(0, ms) / 1000;
    if (s < 60) return (Math.round(s * 10) / 10).toFixed(1) + "s";
    var whole = Math.floor(s);
    var sec = whole % 60;
    return Math.floor(whole / 60) + "m" + (sec < 10 ? "0" : "") + sec + "s";
  }
  /** Accumulated "+N-M" of the current turn's tool calls (live, jumps as each lands). */
  function turnDiffLive() {
    var a = 0, d = 0;
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      if (it.kind === "tool" && it.turn === state.lastTurn && it.diff) {
        a += it.diff.added;
        d += it.diff.deleted;
      }
    }
    return (a || d) ? { added: a, deleted: d } : null;
  }
  /** Aggregate one turn's tool diffs into totals + per-file breakdown. */
  function aggregateTurnDiff(items, turn) {
    var total = { added: 0, deleted: 0, files: [] };
    var byPath = {};
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === "tool" && it.turn === turn && it.diff) {
        total.added += it.diff.added;
        total.deleted += it.diff.deleted;
        var p = it.diff.path || "(未知文件)";
        if (!byPath[p]) byPath[p] = { path: p, added: 0, deleted: 0 };
        byPath[p].added += it.diff.added;
        byPath[p].deleted += it.diff.deleted;
      }
    }
    for (var k in byPath) total.files.push(byPath[k]);
    total.files.sort(function (a, b) { return (b.added + b.deleted) - (a.added + a.deleted); });
    return total;
  }
  /** Rebuild-free tick: only the currently rendered live timers move. */
  function tickLive() {
    var now = Date.now();
    if (!state.running) {
      // Turn is over: no live timer may remain anywhere. Safety net for any
      // render path that failed to remove one — the tick wipes them directly
      // so a stale "counting" timer can never survive past the turn.
      var rem = messagesEl.querySelectorAll(".live-timer");
      for (var ri2 = 0; ri2 < rem.length; ri2++) rem[ri2].remove();
      return;
    }
    var els = messagesEl.querySelectorAll(".live-timer");
    for (var i = 0; i < els.length; i++) {
      var st = parseFloat(els[i].getAttribute("data-start") || "0");
      if (st > 0) els[i].textContent = fmtLive(now - st);
    }
  }
  setInterval(tickLive, 250);

  /* ---------- transcript images (lazy, harness session.attachment) ---------- */
  // attachmentId -> {pending:true} | {data, mediaType} | {failed:true}
  var imageCache = {};
  var imageWaiters = {};   // requestId -> attachmentId
  var imageReqSeq = 1;

  /** Ask the host to resolve one ref's bytes (it calls session.attachment). */
  function requestImage(attachmentId) {
    if (!attachmentId || imageCache[attachmentId]) return;
    imageCache[attachmentId] = { pending: true };
    var reqId = imageReqSeq++;
    imageWaiters[reqId] = attachmentId;
    post({ type: "getAttachment", requestId: reqId, sessionId: state.activeSessionId, attachmentId: attachmentId });
  }

  /** Chip caption: file name, pixel size and byte size when the log carries them. */
  function imageLabel(a) {
    var bits = [];
    if (a.name) bits.push(a.name);
    if (a.width && a.height) bits.push(a.width + "×" + a.height);
    if (a.bytes) bits.push(a.bytes >= 1024 ? Math.round(a.bytes / 1024) + " KB" : a.bytes + " B");
    return bits.join(" · ");
  }

  /** One thumbnail: the real <img> when the bytes are known, otherwise a
   *  placeholder marked with data-attachment for the reply to patch in place. */
  function imageCell(a) {
    var cell = document.createElement("div");
    cell.className = "u-image";
    cell.title = imageLabel(a);
    var cached = a.attachmentId ? imageCache[a.attachmentId] : null;
    var src = a.data || (cached && cached.data);
    if (src) {
      var img = document.createElement("img");
      img.src = "data:" + ((cached && cached.mediaType) || a.mediaType) + ";base64," + src;
      cell.appendChild(img);
    } else {
      var failed = !!(cached && cached.failed);
      var ph = document.createElement("div");
      ph.className = "u-image-ph";
      if (failed) {
        ph.textContent = "🖼 图片读取失败";
        ph.title = (cached && cached.error) || "";
      } else {
        ph.textContent = "🖼 加载中…";
        ph.setAttribute("data-attachment", a.attachmentId);
        requestImage(a.attachmentId);
      }
      cell.appendChild(ph);
    }
    var cap = imageLabel(a);
    if (cap) {
      var span = document.createElement("span");
      span.className = "u-image-cap";
      span.textContent = cap;
      cell.appendChild(span);
    }
    // Click to zoom: resolved at click time so it works both for bytes we
    // already hold and for ones patched in after the attachment reply.
    cell.onclick = function () {
      var im = cell.querySelector("img");
      if (im) openLightbox(im.src, imageLabel(a));
    };
    return cell;
  }

  function userImagesEl(images) {
    var wrap = document.createElement("div");
    wrap.className = "u-images";
    images.forEach(function (a) { wrap.appendChild(imageCell(a)); });
    return wrap;
  }

  /** Human-readable byte size for attachment chips. */
  function fmtBytes(n) {
    if (!n || n < 1024) return (n || 0) + " B";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  /** Non-image attachment chips on a user bubble (name · size). */
  function userFilesEl(files) {
    var wrap = document.createElement("div");
    wrap.className = "u-files";
    files.forEach(function (fl) {
      var chip = document.createElement("span");
      chip.className = "u-file";
      chip.textContent = "📄 " + (fl.name || "文件") + (fl.size ? " · " + fmtBytes(fl.size) : "");
      wrap.appendChild(chip);
    });
    return wrap;
  }

  /** Tool-category tone (opencode-style colors): exec=amber, write=green, read=blue, agent=purple. */
  function toolTone(name) {
    var n = String(name || "");
    if (/^(bash|pwsh|run_code|shell|cmd|exec|terminal)/i.test(n)) return "t-exec";
    if (/^(write|edit|patch|apply_patch|str_replace|insert|create|delete|rename|move|mkdir)/i.test(n)) return "t-write";
    if (/^(read|glob|grep|search|list|ls|find|fetch|view)/i.test(n)) return "t-read";
    if (/^(task|agent|subagent|ask|question)/i.test(n)) return "t-agent";
    return "t-other";
  }
  function renderItem(item) {
    var el = document.createElement("div");
    if (!item.id) item.id = state.nextItemId++;
    el.dataset.key = String(item.id);
    switch (item.kind) {
      case "turn": {
        el.className = "turn-sep";
        // Totals of a finished turn live on the bottom summary strip
        // (kind "turn-end"), not here — so the newest content shows them
        // without scrolling back up. The running turn keeps the live clock
        // and the accumulated "+N-M" so far.
        var turnModel = state.turnModels[item.turn];
        var label = "— " + (turnModel ? esc(turnModel) + " · " : "") + "第 " + item.turn + " 轮";
        if (!item.done) {
          label += " · 进行中";
          if (item.startTime && state.running) {
            // Seed the live timer with its real elapsed from the durable
            // turn/start time: streaming rebuilds, history replays and session
            // switches never flash it back to "0.0s".
            label += "<span class='live-timer' data-start='" + item.startTime + "'>" + fmtLive(Date.now() - item.startTime) + "</span>";
          }
          var ltd = aggregateTurnDiff(state.items, item.turn);

        }

      }
      case "turn-end": {
        el.className = "turn-summary";

        var endModel = state.turnModels[item.turn];
        var s = "<span class='check'>✓</span><span>" + (endModel ? esc(endModel) + " · " : "") + "第 " + item.turn + " 轮完成 · 用时 " + dur + "</span>";
        var td = item.totalDiff;
        if (td && (td.added || td.deleted)) {
          s += diffChipHtml(td);
        }
        el.innerHTML = s;
        if (td && td.files && td.files.length) {
          var det = document.createElement("details");
          det.className = "turn-diff";
          var dsum = document.createElement("summary");
          dsum.textContent = "文件改动明细";
          det.appendChild(dsum);
          td.files.forEach(function (f) {
            var row = document.createElement("div");
            row.className = "td-file";
            var nm = document.createElement("span");
            nm.className = "td-path";
            nm.textContent = f.path;
            nm.title = "点击在 VS Code 中打开";
            row.appendChild(nm);
            row.appendChild(diffChipEl(f, false));
            row.onclick = (function (p) { return function () { post({ type: "openFile", path: p }); }; })(f.path);
            det.appendChild(row);
          });
          el.appendChild(det);
        }
        break;
      }
      case "user": {
        el.className = "msg user";
        if (item.editing) {
          var ta = document.createElement("textarea");
          ta.className = "edit-box";
          ta.value = item.text;
          var act = document.createElement("div");
          act.className = "msg-actions";
          var save = document.createElement("button");
          save.textContent = "保存（打断生效）";
          var cancel = document.createElement("button");
          cancel.textContent = "取消";
          act.appendChild(save);
          act.appendChild(cancel);
          var body = document.createElement("div");
          body.className = "body";
          body.style.maxWidth = "92%";
          body.appendChild(ta);
          body.appendChild(act);
          el.appendChild(body);
          save.onclick = function () {
            var v = ta.value.trim();
            if (!v) return;
            item.editing = false;
            item.text = v;
            post({ type: "send", text: v, mode: "steer" });

          };
          cancel.onclick = function () { item.editing = false; scheduleRender(); };
          ta.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save.onclick(); }
          });

        } else {
          if (item.images && item.images.length) el.appendChild(userImagesEl(item.images));
          // Files get their own row directly above the text bubble.
          if (item.files && item.files.length) el.appendChild(userFilesEl(item.files));
          if (item.text) {
            var ub = document.createElement("div");
            ub.className = "body";
            ub.innerHTML = renderMd(item.text);
            el.appendChild(ub);
          }
          var ua = document.createElement("div");
          ua.className = "msg-actions";
          if (item.turn === state.lastTurn && state.running) {
            var ed = document.createElement("button");
            ed.textContent = "✎ 编辑";
            ed.onclick = function () { item.editing = true; scheduleRender(); };
            ua.appendChild(ed);
          }

            cp.textContent = "⧉ 复制";

      }
      case "assistant": {
        el.className = "msg assistant";
        var html = "";
        // Fold state is keyed by the reasoning block's stable ordinal (the
        // Nth "思考"), NOT the blocks-array index — streaming rebuilds can
        // reorder/shift block indices, which previously lost the state on the
        // third toggle. Collapsed by default; every click is honored.
        var riSeq = 0, bidx = 0;
        item.blocks.forEach(function (b, bi) {
          if (b.type === "reasoning") {
            var mySeq = riSeq++;
            var rOpen = !!(item.reasoningOpen && item.reasoningOpen[mySeq]);
            html += "<div class='reasoning' data-ri='" + mySeq + "'><div class='reasoning-head' data-ri='" + mySeq + "'>" +
                    (rOpen ? "▾" : "▸") + " 思考</div>" +
                    "<div class='reasoning-body'" + (rOpen ? "" : " hidden") + "><pre>" + esc(b.text) + "</pre></div></div>";
          } else {
            html += "<div class='body' data-bidx='" + bidx + "'>" + renderMd(b.text) + (item.streaming ? "<span class='stream-cursor'></span>" : "") + "</div>";
            bidx++;
          }
        });
        if (item.blocks.length === 0 && item.streaming) html = "<div class='body'><span class='stream-cursor'></span></div>";
        el.innerHTML = html;
        // Live timer for the assistant's reply round (only while it is the
        // newest round; gone as soon as the message completes). Seeded with
        // the real elapsed so dense streaming rebuilds never flash it back
        // to "0.0s".
        if (item.streaming && state.activeRound && state.activeRound.kind === "assistant") {
          var lt = document.createElement("span");
          lt.className = "live-timer";
          lt.dataset.start = String(item.startTime || 0);
          lt.textContent = item.startTime ? fmtLive(Date.now() - item.startTime) : fmtLive(0);
          el.appendChild(lt);
        }
        if (!item.streaming && item.blocks.some(function (b) { return b.type === "text"; })) {
          var aa = document.createElement("div");
          aa.className = "msg-actions";
          var acp = document.createElement("button");
          acp.textContent = "⧉ 复制";
          acp.onclick = function () {
            var all = item.blocks.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
            post({ type: "copyText", text: all });

      case "tool": {
        // Collapsible tool call — collapsed by default (the user opens it by

        var det = document.createElement("details");
        det.className = "tool " + toolTone(item.name) + (item.sub ? " sub" : "");
        var dot = item.status === "running" ? "run" : item.status === "error" ? "err" : "ok";
        var sum = document.createElement("summary");
        var d = document.createElement("span");
        d.className = "dot " + dot;
        var nm = document.createElement("span");
        nm.className = "tname";
        var tsum = toolSummaryText(item);
        nm.setAttribute("data-name", item.name);
        nm.textContent = (item.sub ? "↳ " : "⚙ ") + item.name + (tsum ? " : " + tsum : "");
        sum.appendChild(d);
        sum.appendChild(nm);
        // "+N-M" line counts — on the fold row, so they stay visible while

        // Live timer while this tool call is the running round (only the

          var tlt = document.createElement("span");
          tlt.className = "live-timer";
          tlt.dataset.start = String(item.startTime || 0);
          tlt.textContent = item.startTime ? fmtLive(Date.now() - item.startTime) : fmtLive(0);
          sum.appendChild(tlt);

        if (item.argsText) det.appendChild(toolBlock("参数", item.argsText));

        tdet.className = "tool t-todo";

        tdot2.className = "dot ok";

        tname2.className = "tname";

        tsum2.appendChild(tdot2);

      case "cmd": {

  /* ---------- reasoning fold: plain div pair (no <details>), one delegated
     click handler. Fold state is keyed by the reasoning ordinal, so it
     survives the in-place streaming updates below. ---------- */
  messagesEl.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var head = t.closest(".reasoning-head");
    if (!head) return;
    var box = head.closest(".reasoning");
    if (!box) return;
    var body = box.querySelector(".reasoning-body");
    if (!body) return;
    var host = box.closest(".msg.assistant");
    if (!host) return;
    var wasHidden = body.hidden;
    body.hidden = !wasHidden;
    head.textContent = (wasHidden ? "▾" : "▸") + " 思考";
    var key = host.getAttribute("data-key");
    var ri = parseInt(head.getAttribute("data-ri") || "0", 10);
    var item = null;
    for (var i = 0; i < state.items.length; i++) {
      var cand = state.items[i];
      if (cand.kind === "assistant" && String(cand.id) === key) { item = cand; break; }
    }
    if (item) {
      if (!item.reasoningOpen) item.reasoningOpen = {};
      item.reasoningOpen[ri] = wasHidden;
    }
    // Expanding reveals content below the fold — bring it into view so the user
    // actually sees the thinking instead of it opening off-screen (and mark the
    // user's intent as "follow" so a streamed continuation keeps it visible).
    if (wasHidden) {
      if (item && item.streaming) {
        // Live box: jump to the current thinking frontier and keep following
        // it; a finished (history) box opens at its beginning instead.
        body.__follow = true;
        body.scrollTop = body.scrollHeight;
      }
      var boxTop = box.getBoundingClientRect().top;
      var viewBottom = messagesEl.getBoundingClientRect().bottom;
      if (boxTop > viewBottom - 8) {
        box.scrollIntoView({ block: "nearest" });
        atBottom = true; // user just interacted with live content → re-arm follow
      }
    }
  });

  /* Reasoning bodies scroll internally (max-height + overflow-y). Scroll
     events do not bubble, so track them in the capture phase: leaving the
     bottom means the user wants to read back — stop the live follow; coming
     back to the bottom re-arms it. Same anti-hijack contract as the message
     list itself, one level down. */
  messagesEl.addEventListener("scroll", function (ev) {
    var t = ev.target;
    if (t && t.classList && t.classList.contains("reasoning-body")) {
      t.__follow = t.scrollHeight - t.scrollTop - t.clientHeight < 8;
    }
  }, true);

  /* ---------- markdown links: open externally (never navigate the webview) ---------- */
  messagesEl.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    ev.preventDefault();
    post({ type: "openExternal", url: a.getAttribute("href") });
  });

  /* ---------- block-level copy: one delegated listener for every
     .block-copy button (markdown code blocks + tool args/result) ---------- */
  messagesEl.addEventListener("click", function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest(".block-copy") : null;
