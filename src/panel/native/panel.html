<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: vscode-webview-resource:;">
<title>DSH</title>
<script>/*__DASH_MARKDOWN__*/</script>
<style>
  :root {
    --fg: var(--vscode-editor-foreground, #d4d4d4);
    --bg: var(--vscode-sideBar-background, #1e1e1e);
    --muted: var(--vscode-descriptionForeground, #9d9d9d);
    --border: var(--vscode-widget-border, #454545);
    --accent: var(--vscode-button-background, #0e639c);
    --accent-fg: var(--vscode-button-foreground, #ffffff);
    --input-bg: var(--vscode-input-background, #3c3c3c);
    --err: var(--vscode-errorForeground, #f14c4c);
    --ok: #4ec9b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font-family: var(--vscode-font-family); font-size: var(--vscode-font-size, 13px); overflow: hidden; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
  #ws-line { flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 8px;
             font-size: 15px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  #ws-line[hidden] { display: none; }
  #ws-label { flex: none; }
  /* Truncate at the head (not the tail): the leaf folder is the informative part.
     direction:rtl + unicode-bidi:plaintext keeps the path rendered LTR while the
     ellipsis lands on the left. */
  #ws-path { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             direction: rtl; text-align: left; unicode-bidi: plaintext; }
  /* Ask mode (dedicated question-conversation window): the pinned session is
     implicit — session picker, workspace strip and the utility buttons have no
     meaning there. Transcript / input / queue / cards stay. */
  body.ask-mode #ws-line,
  body.ask-mode #session-picker,
  body.ask-mode #settings-btn,
  body.ask-mode #delete-session,
  body.ask-mode #delete-session-hard,
  body.ask-mode #perm-btn,
  body.ask-mode #plan-btn,
  body.ask-mode #balance-chip,
  body.ask-mode #model-btn,
  body.ask-mode #effort-btn { display: none !important; }
  body.ask-mode #input-foot { display: none; }
  /* connection dot — compact: no text, color carries the state */
  .pill { flex: none; width: 10px; height: 10px; border-radius: 50%; font-size: 0; }
  .pill.on { background: var(--ok); }
  .pill.off { background: var(--err); }
  .pill.busy { background: #e0b94a; }
  .pill.loading { background: var(--muted); }
  #session-picker { flex: 1; min-width: 0; position: relative; display: flex; }
  #session-btn { flex: 1; min-width: 0; background: var(--input-bg); color: var(--fg);
                 border: 1px solid var(--border); border-radius: 2px; height: 28px; padding: 0 8px;
                 font-family: inherit; font-size: 12px; text-align: left; cursor: pointer;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #session-btn:hover { border-color: var(--accent); }
  /* session picker: current workspace on top, other workspaces collapsed */
  #session-menu { top: calc(100% + 4px); left: 0; min-width: 240px; max-width: min(420px, 92vw); }
  #session-menu .cp-group { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #session-menu .cp-row .cp-label { flex: 1; min-width: 0; overflow: hidden;
                                    text-overflow: ellipsis; white-space: nowrap; }
  #session-menu .cp-row.sm-empty { color: var(--muted); cursor: default; white-space: normal; }
  #session-menu .cp-row.sm-empty:hover { background: transparent; }
  #session-menu .cp-row.sm-mine .cp-label { font-weight: 600; }
  #session-menu .cp-row.sm-toggle { color: var(--fg); }
  #new-session { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 2px;
                 background: transparent; color: var(--fg); cursor: pointer; }
  #new-session:hover { background: var(--input-bg); }
  /* new-session mode picker: ＋ opens a dropdown of agent presets
     (标准 / PTC / 极简 / 创造), each with hover explanation */
  #new-session-wrap { position: relative; flex: none; }
  #mode-menu { position: absolute; top: calc(100% + 4px); right: 0; min-width: 220px; max-width: 300px;
               background: var(--vscode-quickInput-background, var(--input-bg)); color: var(--fg);
               border: 1px solid var(--border); border-radius: 4px; z-index: 40; font-size: 12px;
               box-shadow: 0 4px 12px rgba(0,0,0,.35); padding: 2px 0; }
  #mode-menu[hidden] { display: none; }
  .mode-item { padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-item:hover { background: var(--vscode-list-activeSelectionBackground, #094771);
                     color: var(--vscode-list-activeSelectionForeground, #ffffff); }
  .mode-item .m-name { font-weight: 600; }
  .mode-item .m-default { font-size: 10px; color: var(--muted); border: 1px solid var(--border);
                          border-radius: 8px; padding: 0 5px; margin-left: 6px; }
  .mode-item:hover .m-default { color: inherit; border-color: rgba(255,255,255,.35); }
  .mode-empty { padding: 6px 10px; color: var(--muted); }
  #mode-tip { position: fixed; z-index: 50; max-width: 280px; background: var(--vscode-editorWidget-background, var(--input-bg));
              color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
              font-size: 11px; line-height: 1.5; box-shadow: 0 4px 12px rgba(0,0,0,.35);
              pointer-events: none; /* pure hint: never intercept hover/clicks over the menu rows */
              white-space: pre-wrap; }
  #mode-tip[hidden] { display: none; }
  #delete-session, #delete-session-hard { flex: none; width: auto; height: 28px; padding: 0 7px; border: 1px solid var(--border); border-radius: 2px;
                    background: transparent; color: var(--fg); cursor: pointer; font-size: 11px; line-height: 1; white-space: nowrap; }
  #delete-session:hover { background: var(--input-bg); border-color: #e0b94a; }
  #delete-session-hard:hover { background: var(--input-bg); border-color: var(--err); }
  #delete-session[data-arm="1"], #delete-session-hard[data-arm="1"] { color: var(--err); border-color: var(--err); font-weight: 600; }
  #workspace-btn { flex: none; width: auto; height: 28px; padding: 0 7px; border: 1px solid var(--border); border-radius: 2px;
                   background: transparent; color: var(--fg); cursor: pointer; font-size: 11px; line-height: 1; white-space: nowrap; }
  #workspace-btn:hover { background: var(--input-bg); border-color: var(--accent); }
  #model-select, #effort-select, #preset-select { flex: none; max-width: 110px; background: var(--input-bg); color: var(--fg);
                   border: 1px solid var(--border); border-radius: 2px; padding: 2px 4px; font-size: 12px; }

  /* Draft-attachment rail — mirrors the official AttachmentRail (ui-attachment):
     64×64 rounded tiles in a scrollbar-less horizontal rail, hover-revealed
     remove, click to zoom. The previous 22px chip + "image.png" label was
     impossible to tell apart once more than one image was attached. */
  #attach-row { display: flex; gap: 10px; padding: 4px 0 6px; overflow-x: auto; overflow-y: hidden;
                scrollbar-width: none; }
  #attach-row::-webkit-scrollbar { display: none; }
  #attach-row[hidden] { display: none; } /* explicit display overrides [hidden]; re-assert */
  .attach-item { position: relative; flex: 0 0 64px; width: 64px; height: 64px; }
  .attach-thumb { display: block; width: 64px; height: 64px; padding: 0; overflow: hidden; cursor: zoom-in;
                  border: 1px solid var(--border); border-radius: 16px; background: var(--input-bg); }
  .attach-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .attach-x { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; padding: 0; display: grid;
              place-items: center; font-size: 12px; line-height: 1; cursor: pointer; border: none;
              border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; opacity: 0;
              transition: opacity .2s ease-in-out; }
  .attach-item:hover .attach-x, .attach-x:focus-visible { opacity: 1; }
  @media (pointer: coarse) { .attach-x { opacity: 1; } }

  /* Full-size preview — the official ImageLightbox shape. */
  #lightbox { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 24px; }
  #lightbox[hidden] { display: none; }
  #lightbox .lb-mask { position: absolute; inset: 0; background: rgba(0,0,0,.62); }
  #lightbox .lb-img { position: relative; max-width: 100%; max-height: calc(100vh - 64px); object-fit: contain;
                      border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  #lightbox .lb-close { position: fixed; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0;
                        display: grid; place-items: center; font-size: 14px; cursor: pointer;
                        border: 1px solid var(--border); border-radius: 999px; background: var(--input-bg);
                        color: var(--fg); }
  #lightbox .lb-cap { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
                      color: var(--muted); font-size: 11px; }

  #messages { flex: 1; overflow-y: auto; padding: 8px 10px; }
  #history-sentinel { height: 1px; }
  .turn-sep { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; color: var(--muted); font-size: 11px; }
  .turn-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* turn summary strip — pinned to the END of a finished turn, so the totals
     (用时 + +N-M) are visible right where the newest content is, without
     scrolling back up to the turn's start separator */
  .turn-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px;
                  padding-top: 6px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .turn-summary .check { color: var(--ok); font-weight: 700; }
  .turn-summary details.turn-diff { flex-basis: 100%; margin-top: 2px; }
  .turn-diff summary { cursor: pointer; user-select: none; color: var(--muted); font-size: 11px; padding: 2px 0; }
  .turn-diff summary:hover { color: var(--fg); }
  .turn-diff .td-file { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 14px; cursor: pointer; border-radius: 2px; }
  .turn-diff .td-file:hover { background: rgba(128, 128, 128, .08); }
  .turn-diff .td-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .msg { margin: 6px 0; line-height: 1.55; word-wrap: break-word; }
  .msg.user { display: flex; justify-content: flex-end; flex-wrap: wrap; }
  /* The image row claims a full line of its own, so pasted images sit ABOVE
     the text bubble instead of sharing the row with it. */
  .msg.user .u-images { flex: 1 1 100%; }
  .msg.user .body { max-width: 92%; background: var(--input-bg); border: 1px solid var(--border);
                    border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; }
  .msg.assistant .body { white-space: pre-wrap; }
  /* Transcript images: what the user actually sent, shown in the bubble the
     way the official conversation view does (the log only stores a ref, so the
     bytes arrive via session.attachment and patch into place). */
  .u-images { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin: 2px 0 4px; }
  .u-image { position: relative; border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
             background: var(--input-bg); cursor: zoom-in; }
  .u-image img { display: block; max-width: 220px; max-height: 160px; object-fit: contain; }
  .u-image-ph { width: 120px; height: 68px; display: flex; align-items: center; justify-content: center;
                color: var(--muted); font-size: 11px; }
  .u-image-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 4px; font-size: 10px;
                 color: var(--muted); background: rgba(0,0,0,.45); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .msg .body pre { margin: 4px 0; padding: 6px 8px; background: var(--input-bg); border-radius: 3px;
    white-space: pre-wrap; word-break: break-all; font-family: var(--vscode-editor-font-family, monospace); font-size: 12px; }
  .msg .body code { word-break: break-all; color: var(--vscode-textPreformat-foreground, #ce9178); }
  .msg .body pre code { color: inherit; }
  .reasoning { border-left: 2px solid var(--border); padding: 2px 10px; color: var(--muted); margin: 4px 0; }
  .reasoning-head { cursor: pointer; user-select: none; font-size: 12px; color: var(--muted); }
  .reasoning-head:hover { color: var(--fg); }
  .reasoning-body { margin: 4px 0; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .reasoning-body[hidden] { display: none; }
  .reasoning-body pre { margin: 4px 0; white-space: pre-wrap; font-family: inherit; font-size: 12px; }
  .msg .stream-cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tool { border: 1px solid var(--border); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .tool summary { cursor: pointer; user-select: none; padding: 4px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .tool .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tool .dot.run { background: #e0b94a; animation: blink 1s infinite; }
  .tool .dot.ok { background: var(--ok); }
  .tool .dot.err { background: var(--err); }
  .tool .tname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  /* tool-category colors (opencode-style): the fold row's name carries the tone */
  .tool.t-exec .tname { color: #e0b94a; }
  .tool.t-read .tname { color: #61afef; }
  .tool.t-write .tname { color: #98c379; }
  /* PTC sub-calls (shell/fs calls inside run_code programs): indented,
     slightly recessed so nested work reads as a distinct layer */
  .tool.sub { border-left: 3px solid var(--border); background: rgba(127, 127, 127, .07); }
  .tool.sub summary { padding-left: 12px; }
  .tool.sub .tname { font-weight: 500; }
  .tool.t-agent .tname { color: #c678dd; }
  /* tool group: consecutive internal tool calls bundled behind one fold —
     open the group, then open an individual tool to see its args/result */
  .tool-group { border: 1px solid var(--border); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .tool-group > summary { cursor: pointer; user-select: none; padding: 4px 8px; font-size: 12px;
                          display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .tool-group > summary:hover { color: var(--fg); }
  .tool-group > summary .g-title { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-group > summary::after { content: "▸"; margin-left: auto; opacity: .7; }
  .tool-group[open] > summary::after { content: "▾"; }
  .tool-group .g-body { border-top: 1px solid var(--border); }
  .tool-group .tool { border: none; border-radius: 0; margin: 0; border-top: 1px solid var(--border); }
  .tool-group .tool:first-child { border-top: none; }
  .tool .targs { padding: 0 8px 6px; }
  .tool .tlabel { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
  .tool pre { margin: 4px 0; padding: 6px 8px; background: var(--input-bg); border-radius: 3px;
              white-space: pre-wrap; word-break: break-all; font-family: var(--vscode-editor-font-family, monospace); font-size: 12px;
              position: relative; padding-right: 56px; }

  /* bridge metrics: "+N-M" diff chips (always visible on the fold row) and
     the live per-round timer (only on the currently running round) */
  .diff-chip { display: inline-flex; align-items: baseline; gap: 3px; margin-left: 6px;
               font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
               user-select: none; white-space: nowrap; vertical-align: middle; }
  .diff-chip .da { color: var(--vscode-gitDecoration-addedResourceForeground, #89d185); }
  .diff-chip .dd { color: var(--vscode-gitDecoration-deletedResourceForeground, #f48771); }
  .diff-chip.pop .da, .diff-chip.pop .dd { animation: chip-pop .4s ease; }
  @keyframes chip-pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .live-timer { margin-left: 6px; font-size: 11px; color: #e0b94a; font-weight: 600;
                font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: middle; }
  .turn-sep .live-timer { color: var(--muted); font-weight: 400; vertical-align: baseline; }
  .turn-total { color: var(--muted); font-weight: 400; }

  /* custom Chinese context menu (right-click) */
  .ctx-menu { position: fixed; z-index: 1200; min-width: 140px; padding: 4px;
              background: var(--vscode-menu-background, var(--input-bg));
              border: 1px solid var(--vscode-menu-border, var(--border)); border-radius: 4px;
              box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .ctx-item { display: block; width: 100%; text-align: left; padding: 4px 10px; font-size: 12px;
              border: none; background: transparent; color: var(--vscode-menu-foreground, var(--fg));
              border-radius: 3px; cursor: pointer; }
  .ctx-item:hover:not(.dis) { background: var(--vscode-menu-selectionBackground, rgba(90,120,180,.35)); }
  .ctx-item.dis { opacity: .45; cursor: default; }
  .ctx-sep { height: 1px; margin: 4px 2px; background: var(--border); }

  /* markdown tables (GFM, mirrors web GUI) */
  .md-table { overflow-x: auto; margin: 6px 0; border: 1px solid var(--border); border-radius: 3px; }
  .md-table table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .md-table th, .md-table td { border: 1px solid var(--border); padding: 4px 8px; text-align: left;
                                white-space: nowrap; word-break: normal; }
  .md-table th { background: var(--input-bg); font-weight: 600; position: sticky; top: 0; }
  .md-table td { white-space: pre-wrap; word-break: break-word; }

  /* markdown headings / em / del (from the grafted micromark engine) */
  .md-h1, .md-h2, .md-h3, .md-h4, .md-h5, .md-h6 { margin: 10px 0 4px; font-weight: 700; line-height: 1.35; }
  .md-h1 { font-size: 17px; } .md-h2 { font-size: 15px; } .md-h3 { font-size: 14px; }
  .md-h4, .md-h5, .md-h6 { font-size: 13px; }
  .body em { font-style: italic; }
  .body del { color: var(--muted); }

  /* micromark extras: lists / quotes / rules / links / task checkboxes */
  .body ul, .body ol { margin: 4px 0 4px 22px; padding: 0; }
  .body li { margin: 1px 0; }
  .body blockquote { margin: 4px 0; padding: 2px 10px; border-left: 2px solid var(--border); color: var(--muted); }
  .body hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .body a { color: var(--vscode-textLink-foreground, #3794ff); text-decoration: none; cursor: pointer; }
  .body a:hover { text-decoration: underline; }
  .body a.md-img-link { color: var(--muted); font-size: 12px; }
  .body input[type="checkbox"] { vertical-align: middle; margin: 0 4px 0 0; }

  /* block-level copy buttons (markdown code blocks + tool args/result) */
  pre.md-code { position: relative; padding-right: 56px; }
  .block-copy { position: absolute; top: 4px; right: 4px; z-index: 5;
                background: var(--input-bg); color: var(--muted); border: 1px solid var(--border);
                border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer; opacity: .85; }
  .block-copy:hover { color: var(--fg); border-color: var(--accent); opacity: 1; }

  .sys-err { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--err); color: var(--err); white-space: pre-wrap; font-size: 12px; }
  .cmd-note { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--ok); color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 12px; line-height: 2; }
  .empty.offline { color: var(--err); }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 72px; color: var(--muted); }
  .loading .whale { width: 60px; opacity: .9; animation: whale-bob 2.4s ease-in-out infinite; }
  .loading .loading-text { font-size: 15px; letter-spacing: .05em; color: var(--fg); }
  @keyframes whale-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .pill.loading { background: rgba(148, 163, 184, .15); color: var(--muted); }

  footer { flex: none; position: relative; border-top: 1px solid var(--border); padding: 6px 8px; }
  #mention-menu { position: absolute; bottom: 100%; left: 8px; right: 8px; max-height: 40vh; overflow-y: auto;
    background: var(--vscode-quickInput-background, var(--input-bg)); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; z-index: 20; font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .m-item { padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-item.sel { background: var(--vscode-list-activeSelectionBackground, #094771);
                color: var(--vscode-list-activeSelectionForeground, #ffffff); }
  .m-item.hint { color: var(--muted); cursor: default; }
  .m-kind { opacity: .5; margin-right: 2px; }
  .m-path { opacity: .6; margin-left: 8px; font-size: 11px; }
  .m-crumbs { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--muted);
              font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-crumbs span { cursor: pointer; }
  .m-crumbs span:hover { color: var(--fg); text-decoration: underline; }
  .m-crumbs span.cur { color: var(--fg); cursor: default; }
  #input-status { font-size: 13px; color: var(--muted); min-height: 19px; margin-bottom: 4px;
                  display: flex; flex-wrap: wrap; align-items: center; line-height: 19px;
                  max-height: 80px; overflow-y: auto; }
  /* Items wrap as whole units (item = one stat chip), never mid-text;
     4 rows max, then scroll. */
  #input-status .st-i { flex: none; white-space: nowrap; }
  #input-status .st-i + .st-i { margin-left: 10px; }
  #input-row { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #input-row[hidden] { display: none; } /* explicit display wins over [hidden]'s default; re-assert it */
  /* The input visual box owns border/background so the non-editable balance
     line reads as the last line INSIDE the box, not a strip below it. */
  .input-box { display: flex; flex-direction: column; background: var(--input-bg);
               border: 1px solid var(--border); border-radius: 3px; }
  .input-box:focus-within { outline: 1px solid var(--accent); }
  #input { flex: none; resize: none; background: transparent; color: var(--fg); border: none;
           border-radius: 0; padding: 6px 8px 2px; font-family: inherit; font-size: 13px; line-height: 18px;
           max-height: 260px; overflow-y: auto; outline: none; } /* height rides autoGrow(): 5 lines min, 10 lines max, then scroll */
  /* composer buttons live on their OWN row BELOW the textarea (mirrors the web
     composer: the input seat is one level higher, buttons sit lower) — so a
     multi-line input never crowds them */
  #composer-btns { display: flex; gap: 6px; align-items: center; }
  .btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--fg); cursor: pointer; flex: none; }
  .btn:hover { background: var(--input-bg); }
  #attach-btn { display: flex; align-items: center; justify-content: center; padding: 0; }
  #attach-btn svg { display: block; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  #cancel { color: var(--err); }

  /* Pending-send strip: docked directly above the input box. Queued/steering
     messages appear ONLY here until the harness delivers them; 排队 is green
     and the text wraps with the same line-height logic as the transcript. */
  #queue-row { display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
  .q-item { display: flex; align-items: flex-start; gap: 6px; border: 1px solid var(--border); border-radius: 3px;
            padding: 4px 8px; background: var(--input-bg); font-size: 13px; }
  .q-item .qtag { font-size: 13px; line-height: 1.55; color: var(--muted); flex: none; }
  .q-item .qtag.queued { color: var(--vscode-charts-green, #89d185); }
  .q-item .qtext { flex: 1; white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.55; color: var(--fg); }
  .q-item .qbtn { flex: none; cursor: pointer; color: var(--muted); padding: 0 3px; border: none; background: none; font-size: 12px; line-height: 1.55; }
  .q-item .qbtn:hover { color: var(--fg); }
  .q-item .qbtn.danger:hover { color: var(--err); }

  .msg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .msg-actions button { cursor: pointer; background: none; border: none; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .msg-actions button:hover { color: var(--fg); }
  .edit-box { width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--fg);
              border: 1px solid var(--accent); border-radius: 3px; padding: 6px 8px;
              font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; }

  /* task bar (todos projection) — sits just above the input row */
  #todo-bar { padding: 2px 8px; background: rgba(128,128,128,.06); }
  #todo-bar[hidden] { display: none; }
  #todo-toggle { cursor: pointer; user-select: none; font-size: 12px; color: var(--fg); background: none;
                 border: none; height: 28px; padding: 0; font-family: inherit; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  #todo-toggle:hover { color: var(--accent); }
  #todo-toggle .tcount { color: var(--muted); font-weight: 400; }
  #todo-toggle .tcount b { color: #e0b94a; font-weight: 600; }
  #todo-toggle .tchevron, #todo-chevron { color: var(--muted); font-size: 10px; }
  #todo-list { margin: 2px 0 4px; padding: 0; list-style: none; max-height: 120px; overflow-y: auto;
               border: 1px solid var(--border); border-radius: 3px; background: var(--input-bg); }
  #todo-list[hidden] { display: none; }
  .t-item { display: flex; align-items: flex-start; gap: 6px; padding: 3px 8px; font-size: 12px; line-height: 1.45; }
  .t-item + .t-item { border-top: 1px solid var(--border); }
  .t-item .tmark { flex: none; width: 14px; text-align: center; font-size: 12px; }
  .t-item.pending .tmark { color: var(--muted); }
  .t-item.in_progress .tmark { color: #e0b94a; }
  .t-item.completed .tmark { color: var(--ok); }
  .t-item.completed .ttext { color: var(--muted); text-decoration: line-through; }
  .t-item.in_progress .ttext { color: var(--fg); }
  .t-item .ttext { flex: 1; word-wrap: break-word; }
  .todo-empty { color: var(--muted); font-size: 11px; padding: 2px 0; }
  /* transcript task-list card body (todo/write snapshots) */
  .todo-tlist { list-style: none; margin: 0; padding: 2px 6px 4px; }

  /* ask card — in-panel "ask about selection" (sits just above the input row) */
  #ask-card { padding: 6px 8px; background: rgba(128,128,128,.06); border-top: 1px solid var(--border); }
  #ask-card[hidden] { display: none; }
  .ask-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .ask-close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer;
               font-size: 12px; padding: 0 2px; font-family: inherit; }
  .ask-close:hover { color: var(--fg); }
  .ask-ctx { font-size: 11px; color: var(--muted); max-height: 64px; overflow-y: auto; word-break: break-all;
             white-space: pre-wrap; border: 1px solid var(--border); border-radius: 3px;
             background: var(--input-bg); padding: 4px 6px; margin-bottom: 6px; }
  .ask-choices { display: flex; flex-wrap: wrap; gap: 4px; }
  .ask-choice { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
                border-radius: 3px; height: 28px; padding: 0 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .ask-choice:hover { border-color: var(--accent); color: var(--accent); }
  .ask-custom-row { display: flex; gap: 4px; margin-top: 6px; }
  .ask-custom-row[hidden] { display: none; }
  #ask-custom-input { flex: 1; background: var(--input-bg); color: var(--fg); border: 1px solid var(--accent);
                      border-radius: 3px; height: 28px; padding: 0 6px; font-family: inherit; font-size: 12px; }
  .ask-send { background: var(--accent); color: var(--bg); border: none; border-radius: 3px;
              height: 28px; padding: 0 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

  /* interaction card — approval / question (agent asked the human) */
  #interact-card { padding: 8px 10px; background: rgba(128,128,128,.05); border-top: 1px solid var(--border); }
  #interact-card[hidden] { display: none; }
  .in-card { border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
             padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .in-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .in-tag { font-size: 10px; padding: 1px 7px; border-radius: 8px; background: rgba(224,185,74,.18); color: #e0b94a;
            flex: none; }
  .in-tag.approval { background: rgba(244,76,76,.15); color: var(--err); }
  .in-ctx { font-size: 12px; color: var(--fg); line-height: 1.5; word-break: break-word;
            white-space: pre-wrap; margin: 4px 0 8px; }
  .in-ctx .in-tool { color: var(--accent); font-weight: 600; }
  .in-q { margin-bottom: 10px; }
  .in-q:last-of-type { margin-bottom: 4px; }
  .in-q .in-qtext { font-size: 13px; color: var(--fg); line-height: 1.5; margin-bottom: 2px; }
  .in-q .in-qhead { display: flex; align-items: flex-start; gap: 8px; }
  .in-q .in-qhead .in-qtext { flex: 1; }
  .in-skip { flex: none; background: none; border: none; color: var(--muted); cursor: pointer;
             font-size: 11px; padding: 2px 4px; border-radius: 4px; font-family: inherit; margin-top: -2px; }
  .in-skip:hover { color: var(--accent); background: rgba(128,128,128,.08); }
  .in-q.skipped .in-qtext { color: var(--muted); text-decoration: line-through; }
  .in-q.skipped .in-opt { opacity: .45; pointer-events: none; }
  .in-q.skipped .in-skip { color: var(--ok); }
  .in-q .in-qheader { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px;
                      margin-bottom: 2px; }
  .in-q .in-qdetail { font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-bottom: 6px; }
  /* plan-review detail: rendered markdown (renderMd), scrollable */
  .in-q .in-qdetail.in-plan { font-size: 12px; color: var(--fg); white-space: normal;
                              max-height: 46vh; overflow-y: auto; }
  /* Options stack vertically — one option per full-width row; label + badge on
     one line, description under it. Single-select shows a number chip, multi a
     checkbox (mirrors the web question composer). */
  .in-opts { display: flex; flex-direction: column; gap: 5px; }
  .in-opt { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
            background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 9px; font-size: 12px; line-height: 1.45; cursor: pointer; font-family: inherit; }
  .in-opt:hover { border-color: var(--accent); }
  .in-opt.sel { border-color: var(--accent); background: rgba(78,201,176,.07); }
  .in-opt .in-num { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border);
                    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
                    color: var(--muted); margin-top: 1px; }
  .in-opt.sel .in-num { border-color: var(--accent); color: var(--accent); background: rgba(78,201,176,.1); }
  .in-opt .in-check { flex: none; width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border);
                      display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
                      color: var(--bg); margin-top: 1px; }
  .in-opt.sel .in-check { border-color: var(--accent); background: var(--accent); color: var(--bg); }
  .in-opt .in-ocopy { flex: 1; min-width: 0; }
  .in-opt .in-oline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .in-opt .in-olabel { word-break: break-word; }
  .in-opt .in-badge { font-size: 10px; padding: 0 6px; border-radius: 8px; background: rgba(78,201,176,.16);
                      color: var(--ok); flex: none; font-weight: 600; }
  .in-opt .in-odesc { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .in-actions { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
  .in-btn { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
            height: 28px; padding: 0 14px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .in-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .in-btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .in-btn.primary:hover:not(:disabled) { filter: brightness(1.15); color: var(--accent-fg); }
  .in-btn.danger { background: rgba(244,76,76,.12); color: var(--err); border-color: var(--err); }
  .in-btn.danger:hover:not(:disabled) { background: rgba(244,76,76,.2); }
  .in-btn:disabled { opacity: .4; cursor: default; }
  #in-submit[hidden] { display: none; } /* submit only on the last question */
  .in-spacer { flex: 1; }
  .in-custom-row { display: flex; gap: 6px; margin-top: 8px; align-items: stretch;
                   border: 1px solid var(--border); border-radius: 6px; padding: 0 8px;
                   background: var(--bg); }
  .in-custom-row:focus-within { border-color: var(--accent); }
  .in-custom-icon { flex: none; color: var(--muted); font-size: 12px; align-self: center; }
  .in-custom-input { flex: 1; background: transparent; color: var(--fg); border: none;
                     padding: 6px 0; font-family: inherit; font-size: 12px; outline: none;
                     resize: vertical; line-height: 1.45; }
  /* question pagination — prev/next + "第 x/y 页" */
  .in-pagenav { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .in-nav { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
            border-radius: 6px; height: 28px; padding: 0 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .in-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .in-nav:disabled { opacity: .4; cursor: default; }
  .in-page { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }

  /* composer popups (permission / model+effort) — slide up from the input row */
  footer { position: relative; }
  .combo-popup { position: absolute; z-index: 20; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    max-height: 264px; overflow-y: auto; font-size: 12px; min-width: 168px; }
  #perm-menu { left: 6px; bottom: 44px; }
  #plan-menu { bottom: 44px; }
  #model-menu { bottom: 44px; }
  #effort-menu { bottom: 44px; }
  .combo-popup .cp-title { padding: 4px 10px; color: var(--muted); font-size: 11px;
                           border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  .combo-popup .cp-row { padding: 4px 10px; cursor: pointer; white-space: nowrap;
                         display: flex; gap: 6px; align-items: center; }
  .combo-popup .cp-row:hover { background: rgba(128,128,128,.12); }
  .combo-popup .cp-row.sel { color: var(--ok); font-weight: 600; }
  .combo-popup .cp-row .cp-sub { color: var(--muted); font-size: 10px; margin-left: auto; }
  /* provider sub-heading in the model menu: the SAME model id ships under each
     provider route (deepseek-official vs deepseek-account), so without a
     section header every model looked duplicated in the flat list. */
  .combo-popup .cp-group { padding: 3px 10px 2px; color: var(--muted); font-size: 10px;
                           border-top: 1px solid var(--border); margin-top: 2px; }
  #settings-btn { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 2px;
                  background: transparent; color: var(--fg); cursor: pointer; font-size: 13px; line-height: 1; }
  #settings-btn:hover { background: var(--input-bg); }
  #perm-btn, #plan-btn, #model-btn, #effort-btn { flex: none; border: 1px solid var(--border); border-radius: 3px;
                          background: var(--input-bg); color: var(--fg); cursor: pointer;
                          font-size: 11px; height: 28px; padding: 0 8px; max-width: 128px;
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #perm-btn:hover, #plan-btn:hover, #model-btn:hover, #effort-btn:hover { border-color: var(--accent); }
  #perm-btn { color: var(--vscode-textLink-foreground, #3794ff); }
  #effort-btn { color: #c678dd; }
  /* Account balance (deepseek-account wallet) — read-only text, slightly
     bold, muted, tabular figures; no button chrome, no interaction. */
  #balance-chip { flex: none; color: var(--muted); font-size: 12px; font-weight: 600;
                  font-variant-numeric: tabular-nums; padding: 0 4px;
                  white-space: nowrap; }
  /* Input foot row: the last non-editable line INSIDE the input area (above
     the button row); the left side hosts the balance readout. */
  #input-foot { display: flex; align-items: center; min-height: 18px; padding: 0 8px 4px; }
  /* Plan-mode toggle (right of the permission chip). Active = blue like the
     permission chip; pend = a queued switch, landing on the next step. */
  #plan-btn.on { color: var(--vscode-textLink-foreground, #3794ff); }
  #plan-btn.pend { opacity: .65; border-style: dashed; }
  /* Composer attachments: non-image files render as name·size chips. The strip
     adapts its height to the content: when image thumbnails are present the
     file chips match the thumbnail height and switch to a large icon. */
  .attach-item.attach-file { flex: 0 0 auto; width: auto; height: auto; }
  .attach-file-chip { display: flex; align-items: center; gap: 6px; height: 28px; max-width: 240px;
                      padding: 0 10px; border: 1px solid var(--border); border-radius: 4px;
                      background: var(--input-bg); font-size: 12px; overflow: hidden; }
  .attach-file-chip .af-icon { flex: none; font-size: 13px; line-height: 1; }
  .attach-file-chip .af-meta { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .attach-file-chip .af-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-file-chip .af-size { color: var(--muted); flex: none; }
  #attach-row.has-images .attach-file-chip { height: 64px; border-radius: 6px; }
  #attach-row.has-images .attach-file-chip .af-icon { font-size: 26px; }
  #attach-row.has-images .attach-file-chip .af-meta { flex-direction: column; align-items: flex-start; gap: 2px; }
  /* Drag-and-drop affordance while files hover the panel. */
  body.dropping #input-row { outline: 2px dashed var(--vscode-focusBorder, #3794ff); outline-offset: -3px; }
  /* Drag trace: stays visible through a claimed drag; if VS Code's webview
     shell hijacks the drag (iframe pointer-events flips off) the hint lingers
     for 5s as visible evidence instead of a silent nothing. */
  #drag-hint { position: fixed; right: 10px; bottom: 34px; z-index: 900; max-width: 70vw;
    padding: 4px 9px; font-size: 11px; color: var(--vscode-editorWidget-foreground, #ccc);
    background: var(--vscode-editorWidget-background, #252526); border: 1px solid var(--border);
    border-radius: 4px; pointer-events: none; }
  /* Companion screenshots render large inline (own row, no fold). */
  .shot { display: flex; flex-direction: column; align-items: flex-start; padding: 0 10px; margin: 4px 0; }
  .shot .u-images { justify-content: flex-start; }
  .shot .u-image { border-radius: 6px; }
  .shot .u-image img { max-width: min(560px, 82vw); max-height: 420px; }
  .shot .u-image-ph { width: 320px; height: 180px; }
  .shot-cap { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: pre-wrap; }
  /* Tool-result images (page_screenshot, read_image, ...). */
  .tool-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
  .tool-images .u-image img { max-width: min(420px, 78vw); max-height: 300px; }
  /* User file chips in the transcript: their own full-width row directly
     above the text bubble (right-aligned), never inside or beside it. */
  /* Sent file chips: the row sits directly above the text bubble — each chip
     is as tall as a single-line bubble (18 + 7 + 7 + 2 border = 34px) and the
     gap down to the bubble is half of that line. */
  .msg.user .u-files { flex: 1 1 100%; }
  .u-files { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin: 2px 0 17px; }
  .u-file { display: inline-flex; align-items: center; padding: 7px 10px; border-radius: 4px; line-height: 18px;
            border: 1px solid var(--border); background: var(--input-bg); font-size: 12px; }
</style>

<body>
  <div id="ws-line" hidden><span id="ws-label">工作区</span><span id="ws-path"></span><button id="workspace-btn" title="选择工作区文件夹（默认使用当前打开的文件夹；选定后新会话在该文件夹创建）">工作区</button></div>
  <header>
    <span id="pill" class="pill off" title="DSH Bridge: 正在加载…"></span>
    <div id="session-picker">
      <button id="session-btn" title="切换会话"></button>
      <div id="session-menu" class="combo-popup" hidden></div>
    </div>
    <button id="settings-btn" title="设置（配置 harness）">⚙</button>
    <div id="new-session-wrap">
      <button id="new-session" title="新会话（选择模式）">＋</button>
      <div id="mode-menu" hidden></div>
    </div>
    <button id="delete-session" title="归档当前会话（停止运行中的任务并从列表移除；harness 侧记录保留，等价 web 的归档）">归档</button>
    <button id="delete-session-hard" title="彻底删除当前会话：停止任务并删除 harness 的会话历史文件（不可恢复）">彻底删除</button>
  </header>
  <main id="messages"><div id="history-sentinel"></div></main>
  <footer>
    <div id="mention-menu" hidden></div>
    <div id="attach-row" hidden></div>
    <section id="todo-bar" hidden>
      <button id="todo-toggle" title="展开/折叠任务">☑ 任务 <span class="tcount" id="todo-count"></span> <span id="todo-chevron">▸</span></button>
      <ul id="todo-list" hidden></ul>
    </section>
    <section id="ask-card" hidden>
      <div class="ask-head">✎ 询问 DSH <button class="ask-close" id="ask-close" title="关闭">✕</button></div>
      <div class="ask-ctx" id="ask-ctx"></div>
      <div class="ask-choices" id="ask-choices"></div>
      <div class="ask-custom-row" id="ask-custom-row" hidden>
        <input id="ask-custom-input" placeholder="输入指令…（Enter 发送）" />
        <button class="ask-send" id="ask-send">➤</button>
      </div>
    </section>
    <section id="interact-card" hidden></section>
    <div id="queue-row" hidden></div>
    <div id="input-row">
      <div class="input-box">
        <textarea id="input" rows="5" placeholder="发消息…（Enter 发送，运行中自动排队；Shift+Enter 换行；可粘贴图片、拖入文件）"></textarea>
        <div id="input-foot"><span id="balance-chip" title="账户余额" hidden></span></div>
      </div>
      <div id="composer-btns">
        <button id="perm-btn" title="权限预设" hidden></button>
        <button id="plan-btn" title="计划模式" hidden></button>
        <div class="in-spacer"></div>
        <button id="model-btn" title="模型" hidden></button>
        <button id="effort-btn" title="推理等级" hidden></button>
        <button id="attach-btn" class="btn" title="添加图片或文件（也可粘贴、从资源管理器拖入）"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button id="send" class="btn primary" title="发送">➤</button>
        <button id="cancel" class="btn" title="停止当前回合" hidden>✕</button>
      </div>
      <input id="attach-file" type="file" multiple hidden />
    <div id="drag-hint" hidden></div>
    </div>
    <div id="perm-menu" class="combo-popup" hidden></div>
    <div id="plan-menu" class="combo-popup" hidden></div>
    <div id="model-menu" class="combo-popup" hidden></div>
    <div id="effort-menu" class="combo-popup" hidden></div>
    <div id="input-status"></div>
  </footer>
<script>
(function () {
  "use strict";
  var vscode = acquireVsCodeApi();
  var $ = function (id) { return document.getElementById(id); };
  var messagesEl = $("messages"), pillEl = $("pill"),
      selBtnEl = $("session-btn"), selMenuEl = $("session-menu"),
      wsLineEl = $("ws-line"), wsPathEl = $("ws-path"),
      attachEl = $("attach-row"), queueEl = $("queue-row"),
      inputEl = $("input"), sendBtn = $("send"), cancelBtn = $("cancel"), statusEl = $("input-status"),
      permBtnEl = $("perm-btn"), planBtnEl = $("plan-btn"), balanceChipEl = $("balance-chip"),
      modelBtnEl = $("model-btn"), effortBtnEl = $("effort-btn"), settingsBtnEl = $("settings-btn"),
      permMenuEl = $("perm-menu"), planMenuEl = $("plan-menu"),
      modelMenuEl = $("model-menu"), effortMenuEl = $("effort-menu"),
      todoBarEl = $("todo-bar"), todoToggleEl = $("todo-toggle"), todoListEl = $("todo-list"),
      todoCountEl = $("todo-count"), todoChevronEl = $("todo-chevron"),
      askCardEl = $("ask-card"), askCtxEl = $("ask-ctx"), askChoicesEl = $("ask-choices"),
      askCloseEl = $("ask-close"), askCustomRowEl = $("ask-custom-row"),
      askCustomInputEl = $("ask-custom-input"), askSendEl = $("ask-send"),
      interactEl = $("interact-card"),
      sentinelEl = $("history-sentinel");

  var state = {
    connected: false, version: null, phase: "searching",
    sessions: [], activeSessionId: null,
    workspace: null,         // effective workspace folder (provider-reported)
    mode: "main",            // "ask" = dedicated question-conversation window
    items: [], seqs: new Set(), oldestSeq: Infinity,
    running: false, lastTurn: -1,
    dirtySync: false,       // one unfrozen render right after turn/end
    curAssistant: null, openBlocks: [],
    titles: {},
    turnModels: {},          // turn number -> model id (from request/header)
    models: null,            // { current: {provider, model}, groups: [...] }
    presets: [],             // permission presets (projections.permissions): [{value,label}]
    permCurrent: "",         // active session's current permission value
    planMode: null,          // {active, pending, variant} | null until the host reports plan
    balance: null,           // account balance view {status,wallets,bonusWallets} | null
    modes: [],               // agent presets for the ＋ mode picker: [{id,name,description,isDefault}]
    interact: null,          // pending interaction card {rpcId, kind, ...} | null
    usage: null,             // active session tokenUsage projection
    queue: [],               // session/queue snapshot for the active session
    commands: [],            // slash-command catalog (commands/list)
    todos: [],               // todos projection for the active session
    todoDoneCarry: 0,        // cumulative completed count across "继续" rebuilds
    todoPrevAll: false,      // previous snapshot fully completed (carry reset rule)
    todoCache: null,         // { sessionId, items } — latest todos seen, survives session switches
    todoOpen: false,         // task-bar expanded?
    hasMore: false,          // older history pages available
    loadingOlder: false,     // a loadOlder request is in flight
    firstTokenTime: 0, turnOutput: 0,
    diffByCall: {},          // callId -> {added, deleted} (bridge-computed "+N-M")
    // Live-timing anchors are DURABLE EVENT TIMES (epoch ms), never a
    // performance.now() sampled when the panel processed the frame. History
    // replay re-applies turn/start and its chunks synchronously, so a
    // processing-time clock collapses every measurement to ~0 and restarts
    // the live counter at zero on each session switch.
    turnStartTime: 0,        // epoch ms of the current turn/start event
    activeRound: null,       // {kind:"tool", callId} | {kind:"assistant"} | null
    nextItemId: 1            // stable per-item ids (reasoning fold state, etc.)
  };

  function post(msg) { try { vscode.postMessage(msg); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function relTime(ts) {
    if (!ts) return "";
    var diff = Date.now() - ts;
    if (diff < 60e3) return "刚刚";
    if (diff < 3600e3) return Math.floor(diff / 60e3) + "分钟前";
    if (diff < 86400e3) return Math.floor(diff / 3600e3) + "小时前";
    if (diff < 172800e3) return "昨天";
    if (diff < 604800e3) return Math.floor(diff / 86400e3) + "天前";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "-" + d.getDate();
  }
  function shortId(id) { return String(id || "").replace(/^session-/, "").slice(0, 8); }

  /* ---------- markdown ----------
     The renderer is the SAME micromark engine the official DSH web GUI uses,
     bundled at build time into the __DASH_MARKDOWN__ script above (see
     src/panel/renderer.ts). This wrapper is just a call + escape fallback. */
  function renderMd(text) {
    try {
      if (window.DshMd) return window.DshMd.render(text);
    } catch (e) {}
    return esc(text);
  }

  /* ---------- helpers on event payloads ---------- */
  function blocksOf(message) { return (message && message.content) || []; }
  function textBlocksOf(message) {
    return blocksOf(message).filter(function (b) { return b && b.type === "text"; })
      .map(function (b) { return b.text; }).join("");
  }
  /**
   * Durable image refs on one message's content array
   * ({type:"image", attachment:{attachmentId, mediaType, width, height, …}}).
   * The log stores ONLY the ref — the bytes are fetched lazily per ref through
   * the harness's own session.attachment RPC (see requestImage).
   */
  function imageBlocksOf(message) {
    return blocksOf(message).filter(function (b) {
      return b && b.type === "image" && b.attachment && b.attachment.attachmentId;
    }).map(function (b) {
      var a = b.attachment;
      return { attachmentId: String(a.attachmentId), mediaType: String(a.mediaType || "image/png"),
               name: a.name ? String(a.name) : "", width: a.width, height: a.height, bytes: a.bytes, data: "" };
    });
  }
  function fileBlocksOf(message) {
    return blocksOf(message).filter(function (b) {
      return b && b.type === "file" && b.attachment && b.attachment.attachmentId;
    }).map(function (b) {
      var a = b.attachment;
      return { attachmentId: String(a.attachmentId), name: a.name ? String(a.name) : "文件", bytes: a.bytes };
    });
  }
  function contentBlocks(message) {
    return blocksOf(message).filter(function (b) {
      return b && (b.type === "text" || b.type === "reasoning");
    }).map(function (b) {
      return { type: b.type, text: String(b.text || "") };
    });
  }
  function prettyArgs(s) {
    try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return String(s || ""); }
  }
  /** PTC sub-call arguments arrive as a JSON TEXT (the byte-identical dispatch
   *  value); accept an already-parsed object too so replay stays safe. */
  function argsTextOf(a) {
    if (typeof a === "string") return prettyArgs(a);
    if (a && typeof a === "object") {
      try { return JSON.stringify(a, null, 2); } catch (e) { return ""; }
    }
    return "";
  }
  function summarizeResult(content) {
    var parts = [];
    (content || []).forEach(function (b) {
      if (b && typeof b.text === "string") parts.push(b.text);
      else if (b && b.type === "tool-result" && Array.isArray(b.content)) parts.push(summarizeResult(b.content));
    });
    var s = parts.join("\n").trim();
    return s.length > 1500 ? s.slice(0, 1500) + "\n…（截断）" : s;
  }

  /* ---------- fold: events -> render items ---------- */
  function finalizeStream() {
    if (state.curAssistant) {
      state.curAssistant.streaming = false;
      state.curAssistant.version = (state.curAssistant.version || 0) + 1;
      state.curAssistant = null;
    }
    state.openBlocks = [];
  }
  /** Cancel-safe turn end: DSH's cancel() stops the turn WITHOUT a turn/end
   *  event, so the running clock (and every live timer) would otherwise keep
   *  counting forever. Called when the host reports running:false; stops all
   *  timers and leaves the final summary to a real turn/end if it ever lands. */
  function softEndTurn() {
    finalizeStream();
    state.activeRound = null;
    for (var i = state.items.length - 1; i >= 0; i--) {
      var it = state.items[i];
      // Running tool calls that never got a result keep their live timer —
      // mark them done and force a partial update so syncToolEl drops it
      // once activeRound is null.
      if (it.kind === "tool" && it.status === "running") {
        it.status = "ok";
        it.version = (it.version || 0) + 1;
      } else if (it.kind === "turn" && !it.done) {
        it.done = true;
        it.endTime = Date.now();
        if (it.startTime) it.elapsed = Math.max(0, it.endTime - it.startTime);
        it.totalDiff = aggregateTurnDiff(state.items, it.turn);
        it.version = (it.version || 0) + 1;
        break;
      }
    }
    scheduleRender();
  }
  /** `evTime` is the triggering event's durable time (epoch ms): the reply
   *  round's live clock anchors there so a replay reproduces the real value
   *  instead of restarting at zero. */
  function ensureAssistant(evTime) {
    if (!state.curAssistant) {
      state.curAssistant = { kind: "assistant", blocks: [], done: false, streaming: true,
                             startTime: typeof evTime === "number" ? evTime : Date.now() };
      state.items.push(state.curAssistant);
    }
  }
  function syncAssistantFromBlocks() {
    if (!state.curAssistant) return;
    state.curAssistant.blocks = state.openBlocks
      .filter(function (b) { return b && b.text; })
      .map(function (b) { return { type: b.type, text: b.text }; });
  }
  function findTool(callId) {
    // Normalize to string: tool/call stores String(callId) while tool/result's
    // toolCallId can arrive as a number — a strict compare would miss the
    // match and leave the card "running" with a live timer forever.
    var cid = String(callId);
    for (var i = state.items.length - 1; i >= 0; i--) {
      if (state.items[i].kind === "tool" && state.items[i].callId === cid) return state.items[i];
    }
    return null;
  }

  function applyEvent(ev) {
    if (ev && typeof ev.seq === "number") {
      if (state.seqs.has(ev.seq)) return;
      state.seqs.add(ev.seq);
      if (ev.seq < state.oldestSeq) state.oldestSeq = ev.seq;
    }
    var d = (ev && ev.data) || {};
    switch (ev && ev.type) {
      case "turn/start":
        finalizeStream();
        state.lastTurn = typeof d.turn === "number" ? d.turn : state.lastTurn + 1;
        state.firstTokenTime = 0; state.turnOutput = 0;
        state.turnStartTime = typeof ev.time === "number" ? ev.time : Date.now();
        state.activeRound = null;
        // A new round is user-visible content: unfreeze even if the user was
        // reading history, or the whole new round would never render.
        if (suspended) { suspended = false; forceBottom = true; }
        state.items.push({ kind: "turn", turn: state.lastTurn, done: false,
                           startTime: state.turnStartTime });
        break;
      case "request/header": {
        // Per-request model (durable in the log): tag the open turn so the
        // divider and the end-of-turn summary can show which model replied.
        var rhCfg = d.header && d.header.config;
        if (rhCfg && typeof rhCfg.model === "string" && state.lastTurn >= 0) {
          state.turnModels[state.lastTurn] = rhCfg.model;
          scheduleRender();
        }
        break;
      }
      case "user/message": {
        // user/message carries content at data.content (assistant/message wraps
        // it under data.message) — accept either shape.
        var msg = d.message || d;
        // The harness injects bookkeeping as user messages — runtime-context
        // snapshots, model-changed notices, approval-policy changes. Only
        // real turns (source.kind === "user") belong in the transcript.
        // EXCEPTION: the companion plugin's deferred tool images (its
        // exec.deferContext) ride a user-role message too — surface those as
        // their own big screenshot row instead of dropping them.
        if (msg.source && msg.source.kind && msg.source.kind !== "user") {
          if (msg.source.kind === "companion") {
            var simgs = imageBlocksOf(msg);
            if (simgs.length) {
              state.items.push({ kind: "shot", text: textBlocksOf(msg), turn: d.turn, images: simgs });
              scheduleRender();
            }
          }
          break;
        }
        var u = textBlocksOf(msg);
        var imgs = imageBlocksOf(msg);
        var files = fileBlocksOf(msg);
        if (u || imgs.length || files.length) {
          // Pending sends (queue/steer) never enter the transcript: they live
          // in the queue strip until the harness actually delivers them, and
          // only then a real bubble is appended at its chronological position.
          state.items.push({ kind: "user", text: u, turn: d.turn,
                             images: imgs.length ? imgs : undefined,
                             files: files.length ? files : undefined });
        }
        break;
      }
      case "assistant/chunk": {
        var chunk = d.chunk || {};
        ensureAssistant(ev.time);
        if (chunk.type === "block-start") {
          state.openBlocks[chunk.index] = { type: chunk.blockType || "text", text: "" };
        } else if (chunk.type === "usage") {
          if (chunk.usage && typeof chunk.usage.outputTokens === "number") state.turnOutput = chunk.usage.outputTokens;
        } else if (chunk.type === "text-delta" || chunk.type === "reasoning-delta") {
          // The newest round is now the assistant's reply (its own live timer);
          // a transition from tool→assistant starts a fresh reply round.
          if (state.activeRound === null || state.activeRound.kind !== "assistant") {
            state.activeRound = { kind: "assistant" };
            if (state.curAssistant) state.curAssistant.startTime = typeof ev.time === "number" ? ev.time : Date.now();
          }
          if (!state.firstTokenTime) state.firstTokenTime = typeof ev.time === "number" ? ev.time : Date.now();
          var b = state.openBlocks[chunk.index] || (state.openBlocks[chunk.index] = { type: chunk.type === "reasoning-delta" ? "reasoning" : "text", text: "" });
          if (chunk.text) b.text += chunk.text;
          syncAssistantFromBlocks();
          if (state.curAssistant) state.curAssistant.version = (state.curAssistant.version || 0) + 1;
        }
        break;
      }
      case "assistant/message": {
        ensureAssistant(ev.time);
        var finMsg = state.curAssistant;
        finMsg.blocks = contentBlocks(d.message);
        finMsg.done = true;
        finMsg.streaming = false;
        finMsg.version = (finMsg.version || 0) + 1;
        state.curAssistant = null;
        state.openBlocks = [];
        state.activeRound = null;
        break;
      }
      case "tool/call": {
        var callId = String(d.callId || "");
        state.activeRound = { kind: "tool", callId: callId };
        state.items.push({ kind: "tool", callId: callId, name: d.name || "tool",
                           argsText: prettyArgs(d.arguments), status: "running", resultText: "",
                           turn: typeof d.turn === "number" ? d.turn : state.lastTurn,
                           startTime: typeof ev.time === "number" ? ev.time : Date.now(),
                           diff: state.diffByCall[callId] || null });
        break;
      }
      case "tool/result": {
        var msg = d.message || {};
        // v4 wire: toolCallId / isError are on the message itself, content is a
        // plain block list. The retired v3 wrapper (content[type='tool-result'])
        // stays as a fallback for migrated/replayed old logs.
        var v3block = null;
        (msg.content || []).forEach(function (b) { if (b && b.type === "tool-result") v3block = b; });
        var callId = msg.toolCallId || d.callId || (v3block && v3block.toolCallId);
        var isError = msg.isError === true || !!(v3block && v3block.isError);
        var tool = findTool(callId);
        if (tool) {
          tool.status = isError ? "error" : "ok";
          var resultContent = Array.isArray(msg.content) && msg.content.length ? msg.content : (v3block && v3block.content);
          tool.resultText = summarizeResult(resultContent);
          var rImgs = imageBlocksOf(msg);
          if (rImgs.length) tool.images = (tool.images || []).concat(rImgs);
          tool.version = (tool.version || 0) + 1;
        }
        if (state.activeRound && state.activeRound.kind === "tool" && state.activeRound.callId === String(callId)) {
          state.activeRound = null;
        }
        break;
      }
      case "tool/ptc-dispatch-start": {
        // Nested (PTC) sub-call starting inside a run_code program: render it
        // as its own tool card (opencode-style per-command rows) instead of
        // burying every child call behind the parent run_code fold.
        var subId = String(d.subCallId || "");
        if (!subId) break;
        state.items.push({ kind: "tool", callId: subId, name: d.name || "tool",
                           argsText: argsTextOf(d.arguments), status: "running", resultText: "",
                           turn: typeof d.turn === "number" ? d.turn : state.lastTurn,
                           startTime: typeof ev.time === "number" ? ev.time : Date.now(),
                           sub: true });
        break;
      }
      case "tool/ptc-dispatch": {
        var subId2 = String(d.subCallId || "");
        if (!subId2) break;
        var subTool = findTool(subId2);
        if (!subTool) {
          // Settled without a seen start (page boundary): render the row anyway.
          subTool = { kind: "tool", callId: subId2, name: d.name || "tool",
                      argsText: argsTextOf(d.arguments), status: "ok", resultText: "",
                      turn: typeof d.turn === "number" ? d.turn : state.lastTurn, sub: true };
          state.items.push(subTool);
        }
        subTool.status = d.isError === true ? "error" : "ok";
        subTool.resultText = summarizeResult(d.content);
        subTool.version = (subTool.version || 0) + 1;
        break;
      }
      case "todo/write": {
        // Durable task-list snapshots (dsh-tool-todo emits todo/write). The
        // bottom task bar is per-turn by design (resets every turn/start), so
        // without a transcript record an interrupted list becomes invisible
        // forever — record each snapshot as a card in the conversation.
        state.items.push({ kind: "todo", todos: Array.isArray(d.todos) ? d.todos : [],
                           turn: typeof d.turn === "number" ? d.turn : state.lastTurn });
        break;
      }
      case "turn/end": {
        finalizeStream();
        state.activeRound = null;
        // Safety net: if a tool/result failed to match (callId type drift) the
        // card would stay "running" with a live timer forever — close every
        // still-running tool the moment the turn ends.
        for (var ri = state.items.length - 1; ri >= 0; ri--) {
          var rit = state.items[ri];
          if (rit.kind === "tool" && rit.status === "running") {
            rit.status = "ok";
            rit.version = (rit.version || 0) + 1;
          }
        }
        // New turn boundary: always visible, even if the view was frozen while
        // the user was reading history.
        if (suspended) { suspended = false; forceBottom = true; }
        var endTurn = null;
        for (var i = state.items.length - 1; i >= 0; i--) {
          var turnItem = state.items[i];
          if (turnItem.kind === "turn") {
            turnItem.done = true;
            turnItem.endTime = typeof ev.time === "number" ? ev.time : Date.now();
            turnItem.elapsed = turnItem.startTime ? Math.max(0, turnItem.endTime - turnItem.startTime) : undefined;
            turnItem.totalDiff = aggregateTurnDiff(state.items, turnItem.turn);
            turnItem.version = (turnItem.version || 0) + 1;
            endTurn = { turn: turnItem.turn, elapsed: turnItem.elapsed, totalDiff: turnItem.totalDiff };
            break;
          }
        }
        // Bottom-of-turn summary strip: appears the moment the turn ends, so
        // the totals are right under the newest message (no scrolling up).
        if (endTurn) {
          state.items.push({ kind: "turn-end", turn: endTurn.turn, elapsed: endTurn.elapsed, totalDiff: endTurn.totalDiff });
          // The final render of this round must still happen even though the
          // turn-end makes everything frozen: rAF coalescing can delay the
          // last text-delta render past this boundary, and frozen would then
          // lock the card at its pre-text state (missing body, "no text"
          // until reload). Let the NEXT render ignore frozen once.
          state.dirtySync = true;
        }
        break;
      }
      case "session/title":
        if (typeof d.title === "string") { state.titles[state.activeSessionId] = d.title; }
        break;
    }
    scheduleRender();
  }

  /** Map a page of older (already-complete) log events into read-only items
   *  for the infinite-scroll prepend. Old history contains whole messages
   *  (user/message, assistant/message, tool/call+result, turn markers), not
   *  streaming chunks, so a direct mapping is safe and cheap. */
  function olderItemsFrom(events) {
    var out = [];
    var curTool = null;
    var histTurn = 0;
    var toolsByCallId = {};
    events.forEach(function (ev) {
      if (!ev) return;
      var d = ev.data || {};
      switch (ev.type) {
        case "turn/start": {
          var tnum = typeof d.turn === "number" ? d.turn : out.length;
          histTurn = tnum;
          // If this turn's end strip was already loaded (newer page came
          // first), mark it done right away instead of showing "进行中".
          var preDone = null;
          for (var pi = state.items.length - 1; pi >= 0; pi--) {
            var pit = state.items[pi];
            if (pit.kind === "turn-end" && pit.turn === tnum) { preDone = pit; break; }
          }
          out.push({ kind: "turn", turn: tnum, done: !!preDone,
                     startTime: typeof ev.time === "number" ? ev.time : 0,
                     elapsed: preDone ? preDone.elapsed : undefined });
          break;
        }
        case "turn/end": {
          var doneTurn = null;
          for (var i = out.length - 1; i >= 0; i--) {
            var t = out[i];
            if (t.kind === "turn" && !t.done) {
              t.done = true;
              t.endTime = typeof ev.time === "number" ? ev.time : 0;
              if (t.startTime) t.elapsed = Math.max(0, t.endTime - t.startTime);
              var total = aggregateTurnDiff(out, t.turn);
              t.totalDiff = total;
              doneTurn = { turn: t.turn, elapsed: t.elapsed, totalDiff: total };
              break;
            }
          }
          if (doneTurn) {
            out.push({ kind: "turn-end", turn: doneTurn.turn, elapsed: doneTurn.elapsed, totalDiff: doneTurn.totalDiff });
          }
          break;
        }
        case "request/header": {
          var rhc = d.header && d.header.config;
          if (rhc && typeof rhc.model === "string" && histTurn > 0) state.turnModels[histTurn] = rhc.model;
          break;
        }
        case "user/message": {
          var msg = d.message || d;
          var u = textBlocksOf(msg);
          // Same as live rendering: bookkeeping user messages (runtime-context,
          // model-selection, user-approval) stay out of the transcript — except
          // companion tool images, which become their own screenshot row.
          if (msg.source && msg.source.kind && msg.source.kind !== "user") {
            if (msg.source.kind === "companion") {
              var shimgs = imageBlocksOf(msg);
              if (shimgs.length) out.push({ kind: "shot", text: u, turn: d.turn, images: shimgs });
            }
            break;
          }
          var himgs = imageBlocksOf(msg);
          var hfiles = fileBlocksOf(msg);
          if (u || himgs.length || hfiles.length) out.push({ kind: "user", text: u, turn: d.turn,
                                            images: himgs.length ? himgs : undefined,
                                            files: hfiles.length ? hfiles : undefined });
          break;
        }
        case "assistant/message": {
          var blocks = contentBlocks(d.message);
          if (blocks.length) out.push({ kind: "assistant", blocks: blocks, done: true, streaming: false });
          break;
        }
        case "tool/call":
          curTool = { kind: "tool", callId: String(d.callId || ""), name: d.name || "tool",
                      argsText: prettyArgs(d.arguments), status: "ok", resultText: "",
                      turn: typeof d.turn === "number" ? d.turn : 0,
                      diff: state.diffByCall[String(d.callId || "")] || null };
          out.push(curTool);
          toolsByCallId[String(d.callId || "")] = curTool;
          break;
        case "tool/result": {
          var m = d.message || {};
          var v3b = null;
